[package]
name = "xtask-shim"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["rt-multi-thread"] }
trellis-cli = { path = "../rust/crates/cli", default-features = false }
trellis-codegen-ts = { path = "../rust/crates/codegen-ts" }
trellis-codegen-rust = { path = "../rust/crates/codegen-rust" }
trellis-idl = { path = "../rust/crates/idl" }
trellis-protocol = { path = "../rust/crates/protocol" }
wasm-bindgen-cli-support = "=0.2.125"

[[bin]]
name = "xtask-shim"
path = "../rust/xtask/src/main.rs"
