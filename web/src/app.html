<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/assets/web/trellis-logo.svg" />
    <script>
      (() => {
        const url = new URL(window.location.href);
        const route = url.searchParams.get("__trellis_route");
        if (route === null) return;

        url.searchParams.delete("__trellis_route");
        const basePath = url.pathname.endsWith("/")
          ? url.pathname
          : `${url.pathname}/`;
        const restored = new URL(route || ".", `${url.origin}${basePath}`);

        history.replaceState(
          history.state,
          "",
          `${restored.pathname}${restored.search}${restored.hash}`,
        );
      })();
    </script>
    <script>
      // Before paint, so a dark page never flashes light. The Portal reads
      // the same "trellis.theme" key.
      (() => {
        let mode = null;
        try {
          mode = localStorage.getItem("trellis.theme");
        } catch (_) {}
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "trellis-dark" : "trellis",
        );
      })();
    </script>
    <script src="%sveltekit.assets%/assets/web/runtime-config.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
