server {
  listen 80;
  listen [::]:80;
  server_name _;
  # Behind a proxy, redirect relative to the address the browser used.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index 200.html;

  location = / {
    return 302 /console/;
  }

  location = /assets/web/runtime-config.js {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /200.html;
  }

  location /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
}
