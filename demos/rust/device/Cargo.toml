[package]
name = "trellis-rust-demo-device"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
trellis-rs = "0.100.0"
device-trellis = { package = "demo-device", path = "trellis" }
