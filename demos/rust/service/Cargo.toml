[package]
name = "trellis-rust-demo-service"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
async-nats = "0.47.0"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
futures-util = "0.3.32"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "=0.3.46", features = ["formatting"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trellis-rs = "0.100.0"
service-trellis = { package = "demo-rust-service", path = "trellis" }
