[package]
name = "trellis-performance"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
performance-trellis = { path = "../crates/performance-trellis" }
trellis-rs = { path = "../../../crates/trellis" }
axum = "0.8.8"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[patch.crates-io]
trellis-rs = { path = "../../../crates/trellis" }
