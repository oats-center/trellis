[package]
name = "trellis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Trellis server process orchestration."
publish = false

[lints]
workspace = true

[dependencies]
clap.workspace = true
miette.workspace = true
libc = "0.2.186"
serde_json.workspace = true
url.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
trellis-bootstrap = { path = "../bootstrap", version = "0.100.0-rc.5" }
trellis-local-nats = { path = "../local-nats", version = "0.100.0-rc.5" }
trellis-runtime = { path = "../runtime", version = "0.100.0-rc.5" }
trellis-rs = { path = "../trellis", version = "0.100.0-rc.5", features = ["telemetry-otlp"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "trellis-server"
path = "src/main.rs"
