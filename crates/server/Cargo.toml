[package]
name = "trellis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Trellis server process orchestration."
publish = false

[lints]
workspace = true

[dependencies]
clap.workspace = true
miette.workspace = true
libc = "0.2.186"
serde_json.workspace = true
time.workspace = true
url.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
trellis-bootstrap = { path = "../bootstrap", version = "0.100.0-rc.31" }
trellis-self-update = { path = "../self-update" }
trellis-local-nats = { path = "../local-nats", version = "0.100.0-rc.31" }
trellis-runtime = { path = "../runtime", version = "0.100.0-rc.31" }
trellis-rs = { path = "../trellis", version = "0.100.0-rc.31", features = ["telemetry-otlp"] }

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }
tempfile.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[[bin]]
name = "trellis-server"
path = "src/main.rs"
