[package]
name = "trellis-rs"
version.workspace = true
publish = ["crates-io"]
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Curated public Rust facade for Trellis clients and services."
readme = "../../README.md"

[features]
event-store-sqlite = ["dep:rusqlite"]
event-store-postgres = ["dep:postgres"]
live-integration = []
runtime-internals = []
telemetry-otlp = [
  "dep:opentelemetry-otlp",
  "reqwest/blocking",
]

[[test]]
name = "integration"
required-features = ["live-integration"]

[dependencies]
async-nats.workspace = true
base64.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hkdf = "0.13.0"
hmac = "0.13.0"
nkeys = "0.4"
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry.workspace = true
postgres = { version = "0.19.12", optional = true }
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
rusqlite = { workspace = true, optional = true }
rustls.workspace = true
rustls-platform-verifier.workspace = true
ryu-js.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
trellis-protocol = { path = "../protocol", version = "0.100.0" }
tracing.workspace = true
tokio-util.workspace = true
ulid.workspace = true
url.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
trellis-local-nats = { path = "../local-nats" }
trellis-bootstrap = { path = "../bootstrap" }
trellis-testkit = { path = "../trellis-testkit" }
trellis-runtime-apis = { path = "../runtime-apis" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.186"

[lints]
workspace = true
