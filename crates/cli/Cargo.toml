[package]
name = "trellis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for generating, validating, and operating Trellis contracts and services."
publish = false

[features]
default = ["runtime"]
runtime = ["dep:trellis-bootstrap", "dep:trellis-runtime", "dep:trellis-rs", "dep:trellis-runtime-apis", "dep:qrcode", "dep:rusqlite", "dep:self_update", "dep:tracing-subscriber", "dep:tracing-opentelemetry"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
owo-colors.workspace = true
qrcode = { version = "0.14.1", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
toml.workspace = true
toml_edit.workspace = true
json5 = "1.3.1"
tokio.workspace = true
trellis-rs = { path = "../trellis", version = "0.100.0", optional = true, features = ["telemetry-otlp"] }
trellis-runtime-apis = { path = "../runtime-apis", optional = true }
trellis-codegen-rust = { path = "../codegen-rust", version = "0.100.0" }
trellis-codegen-ts = { path = "../codegen-ts", version = "0.100.0" }
trellis-idl = { path = "../idl", version = "0.100.0" }
trellis-local-bootstrap = { path = "../local-bootstrap", version = "0.100.0" }
trellis-protocol = { path = "../protocol", version = "0.100.0" }
trellis-bootstrap = { path = "../bootstrap", version = "0.100.0", optional = true }
trellis-runtime = { path = "../runtime", version = "0.100.0", optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
miette.workspace = true
notify-debouncer-mini.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
docker_credential = "1.4.0"
ed25519-dalek.workspace = true
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
pathdiff = "0.2"
sha2.workspace = true
tar.workspace = true
rand.workspace = true
rusqlite = { workspace = true, optional = true }
rustls.workspace = true
tempfile.workspace = true
self_update = { workspace = true, optional = true }
time.workspace = true
ulid.workspace = true

[dev-dependencies]
axum.workspace = true
registry-testkit = "0.1.3"
reqwest.workspace = true

[[bin]]
name = "trellis"
path = "src/main.rs"
required-features = ["runtime"]
