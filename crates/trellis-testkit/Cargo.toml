[package]
name = "trellis-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated live Trellis runtimes for Rust integration tests."
readme = "README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "src/**", "generated/src/**", "generated/*.json", "generated/modules.rs"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
trellis-rs = { path = "../trellis", version = "0.100.0-rc.34" }
trellis-protocol = { path = "../protocol", version = "0.100.0-rc.26" }
trellis-models = { path = "../models", version = "0.100.0-rc.26" }
flate2 = "1.1.9"
tar = "0.4.46"
libc = "0.2.186"
socket2 = "0.6.4"
ulid.workspace = true
url = { workspace = true }

[dev-dependencies]
trellis-rs = { path = "../trellis", version = "0.100.0-rc.34" }
trellis-runtime-apis = { path = "../runtime-apis" }
trellis-idl = { path = "../idl" }
toml = "1.1.2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
runtime-trellis = { path = "../../integration/fixtures/runtime/crates/runtime-trellis" }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
