[package]
name = "trellis-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated live Trellis runtimes for Rust integration tests."
readme = "README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "src/**"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
toml = "1.1.2"
trellis-rs = { path = "../trellis", version = "0.100.0" }
trellis-runtime-apis = { path = "../runtime-apis", version = "0.100.0" }
trellis-runtime = { path = "../runtime", version = "0.100.0" }
trellis-bootstrap = { path = "../bootstrap", version = "0.100.0" }
trellis-local-nats = { path = "../local-nats", version = "0.100.0" }
ulid.workspace = true
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
