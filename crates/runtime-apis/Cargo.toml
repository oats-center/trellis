[package]
name = "trellis-runtime-apis"
version = "0.100.0"
edition = "2021"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/oats-center/trellis"
description = "Internal generated administration APIs for the Trellis runtime."

[dependencies]
trellis-rs = { path = "../trellis", version = "0.100.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"

[build-dependencies]
trellis-builtin-contracts = { path = "../builtin-contracts", version = "0.100.0" }
trellis-codegen-rust = { path = "../codegen-rust", version = "0.100.0" }
