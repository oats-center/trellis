[package]
name = "trellis-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated live Trellis runtimes for Rust integration tests."
readme = "README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "src/**"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.15.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { workspace = true }
trellis-rs = { path = "../trellis", version = "0.100.0-rc.2" }
ulid = "1.2.0"
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
