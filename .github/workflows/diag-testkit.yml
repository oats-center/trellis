name: Diag testkit

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Check run providing the exact runtime and testkit executables"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  testkit:
    name: Compare exact testkit (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: self-hosted
            runner: [self-hosted, Linux, X64]
          - host: github-hosted
            runner: ubuntu-latest
    env:
      EXECUTION_ROOT: ${{ github.workspace }}/.local/ci/testkit-diag-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Check-built runtime and testkit binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ env.EXECUTION_ROOT }}/binaries
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Prepare exact executables
        run: |
          set -euo pipefail
          umask 077
          chmod go-w "$HOME"
          mkdir -p "$EXECUTION_ROOT/nats" "$EXECUTION_ROOT/runtime"
          chmod 700 "$EXECUTION_ROOT" "$EXECUTION_ROOT/nats" "$EXECUTION_ROOT/runtime"
          tar -xzf "$EXECUTION_ROOT/binaries/runtime-binaries.tar.gz" -C "$EXECUTION_ROOT/binaries"
          bash scripts/acquire-test-nats.sh --dest "$EXECUTION_ROOT/nats"
          sha256sum "$EXECUTION_ROOT/binaries/trellis-server" "$EXECUTION_ROOT/binaries/trellis" "$EXECUTION_ROOT/binaries/trellis-testkit-live" "$EXECUTION_ROOT/nats/nats-server"

      - name: Run unchanged parallel suite without instrumentation
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$EXECUTION_ROOT/runtime"
          export TRELLIS_TEST_SERVER_BIN="$EXECUTION_ROOT/binaries/trellis-server"
          export TRELLIS_TEST_CLI_BIN="$EXECUTION_ROOT/binaries/trellis"
          export TRELLIS_TEST_NATS_BIN="$EXECUTION_ROOT/nats/nats-server"
          uname -a
          df -h "$EXECUTION_ROOT"
          for pressure in cpu io memory; do
            cat "/proc/pressure/$pressure"
          done
          "$EXECUTION_ROOT/binaries/trellis-testkit-live"
