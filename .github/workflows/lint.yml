name: Lint

# Formatting needs no generated artifacts, so it runs apart from Check and never
# holds back a build or test. Branch protection still requires it to merge.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install formatter
        run: npm ci --ignore-scripts

      # The same command local `npm test` runs; every check reports even when
      # another fails.
      - name: Check formatting
        run: bash scripts/check.sh lint
