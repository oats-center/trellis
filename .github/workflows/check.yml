name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  # CI debug/test artifacts retain file-and-line backtraces, not full DWARF.
  # Production release optimization and debug assertions remain unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  # Formatting runs in the separate Lint workflow so it never holds back a build.
  # A pull request that touches only prose skips the build and test graph; the
  # acceptance gate still reports. Pushes and manual runs always verify fully.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!design/**'
              - '!docs/src/**'
              - '!docs/static/**'
              - '!*.md'

  install:
    name: Install generated artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reset isolated installation state
        run: rm -rf target

      - name: Enable multithreaded Zstandard caching
        run: bash scripts/ensure-ci-zstd.sh

      - name: Cache installation build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-

      - name: Install generated artifacts
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install

      - name: Report installation cache input size
        if: always()
        run: du -sh target 2>/dev/null || true

      - name: Upload installed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-generated
          path: |
            crates/trellis/generated
            crates/models/generated
            crates/trellis-testkit/generated
            web/trellis
            ts/packages/trellis-testkit/trellis
            integration/fixtures/runtime/packages/runtime-trellis
            integration/fixtures/runtime/v2/packages/runtime-trellis
            integration/fixtures/runtime-pinned/packages/runtime-trellis
            integration/fixtures/runtime-removed/packages/runtime-trellis
            integration/fixtures/client-upgrade/packages/client-upgrade
            integration/fixtures/client-upgrade-narrow/packages/client-upgrade
            integration/fixtures/client-upgrade-consent/packages/client-upgrade
            integration/fixtures/client-upgrade-breaking/packages/client-upgrade
            integration/fixtures/testkit/crates/trellis-test-fixture
            integration/fixtures/testkit/packages/trellis-test-fixture
            benchmarks/runtime/crates/performance-trellis
            benchmarks/runtime/packages/performance-trellis
            ts/packages/trellis/internal_sdk/generated
            demos/rust/service/trellis
            demos/rust/device/trellis
            demos/ts/service/trellis
            demos/ts/device/trellis
            demos/app/trellis
            docs/examples/orders/trellis
          include-hidden-files: true
          retention-days: 1

  wasm:
    name: Protocol WASM
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build protocol WASM
        run: cargo run --manifest-path xtask/Cargo.toml -- protocol-wasm

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

  dex:
    name: Build test identity provider
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dex publishes container images but no release binaries, so build the
    # pinned v2.46.0 commit once and reuse it until the pin changes.
    env:
      DEX_COMMIT: 05a275057112ba93e17db21f600b756f000f1c21
    steps:
      - name: Restore built Dex
        id: dex-cache
        uses: actions/cache@v4
        with:
          path: dex-bin/dex
          key: dex-${{ runner.os }}-${{ runner.arch }}-${{ env.DEX_COMMIT }}

      - name: Check out pinned Dex source
        if: steps.dex-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: dexidp/dex
          ref: ${{ env.DEX_COMMIT }}
          path: dex-source

      - name: Set up Go
        if: steps.dex-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: dex-source/go.mod
          cache-dependency-path: dex-source/go.sum

      # Dex's API is an in-tree module replacement, so build the pinned tree
      # rather than attempting go install against a detached module download.
      - name: Build Dex
        if: steps.dex-cache.outputs.cache-hit != 'true'
        working-directory: dex-source
        run: go build -mod=readonly -trimpath -o "$GITHUB_WORKSPACE/dex-bin/dex" ./cmd/dex

      - name: Upload test identity provider
        uses: actions/upload-artifact@v4
        with:
          name: check-dex
          path: dex-bin/dex
          retention-days: 1

  portal:
    name: Embedded browser apps
    needs: [install, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node workspace dependencies
        run: npm ci

      # Consume the already-generated API artifacts and protocol WASM; do not
      # re-run the developer wrapper that recompiles xtask and the WASM.
      - name: Build embedded browser apps
        run: npm run browser:embedded

      - name: Upload embedded browser apps
        uses: actions/upload-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated
          retention-days: 1

  clippy:
    name: Rust lint
    needs: [install, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Enable multithreaded Zstandard caching
        run: bash scripts/ensure-ci-zstd.sh

      - name: Cache Rust lint artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-

      - name: Lint Rust
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets --features trellis-rs/event-store-sqlite,trellis-rs/event-store-postgres -- -D warnings

  build-fixtures:
    name: Build integration fixture binaries
    needs: [install, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable multithreaded Zstandard caching
        run: bash scripts/ensure-ci-zstd.sh

      - name: Cache fixture build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'integration/fixtures/**/Cargo.toml', 'integration/fixtures/**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-

      # Cross-language helper/provider executables for the TypeScript integration
      # tests, the testkit live test binary and the health_watch example. Built
      # once here so the tests do not compile Rust while they run.
      - name: Build integration fixture helpers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo build --bins \
            --manifest-path integration/fixtures/runtime/Cargo.toml \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\""
          cargo build --manifest-path Cargo.toml -p trellis-runtime --example health_watch

      - name: Build the testkit live test binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo test --no-run \
            --manifest-path integration/fixtures/testkit/Cargo.toml \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\"" \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-testkit.path=\"$GITHUB_WORKSPACE/crates/trellis-testkit\"" \
            --test live \
            --message-format=json > "$RUNNER_TEMP/testkit-live.json"
          executable="$(jq -r 'select(.executable != null) | .executable' "$RUNNER_TEMP/testkit-live.json" | tail -n1)"
          if [ -z "${executable}" ] || [ "${executable}" = "null" ]; then
            echo "failed to locate the testkit live test binary" >&2
            exit 1
          fi
          cp "${executable}" target/debug/trellis-testkit-live

      # Upload compresses the artifact; the tar only preserves executable modes.
      - name: Stage fixture binaries
        run: |
          set -euo pipefail
          umask 077
          staging="$RUNNER_TEMP/fixture-binaries"
          rm -rf "$staging"
          mkdir -p "$staging/fixtures" "$staging/examples"
          cp target/debug/trellis-testkit-live "$staging/"
          for bin in trellis-runtime-acceptance caller resources events live_probe live_probe_caller live_application_versions empty_watch finite_rpc rpc_distribution operation_target operation_storage_upload operation_lease_loss device_companion transport_growth_subject transport_growth_operation transfer_generation jobs; do
            cp "target/debug/${bin}" "$staging/fixtures/"
          done
          cp target/debug/examples/health_watch "$staging/examples/"
          find "$staging" -type f -exec strip --strip-unneeded {} +
          tar -C "$staging" -cf "$RUNNER_TEMP/fixture-binaries.tar" .

      - name: Upload fixture binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-fixture-binaries
          path: ${{ runner.temp }}/fixture-binaries.tar
          retention-days: 1

  build:
    name: Build runtime binaries
    needs: [install, wasm, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      # The one release build every live, browser, demo, package, and image job
      # runs, compiled against the runtime image's Debian bookworm glibc. See
      # crates/runtime/Containerfile.build for why it is a container build.
      - name: Build release binaries
        run: |
          set -euo pipefail
          docker buildx build --builder default --pull \
            --file crates/runtime/Containerfile.build \
            --output "type=local,dest=$RUNNER_TEMP/release" \
            .

      - name: Stage runtime binaries and CLI archives
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/runtime-binaries"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$RUNNER_TEMP/release/trellis" "$RUNNER_TEMP/release/trellis-server" "$staging/"
          bash scripts/acquire-test-nats.sh --dest "$staging/nats"
          tar -C "$staging" -czf "$RUNNER_TEMP/runtime-binaries.tar.gz" .
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="x86_64-unknown-linux-gnu"
          archive="trellis-${version}-${target}.tar.gz"
          mkdir -p dist
          tar -C "$RUNNER_TEMP/release" -czf "dist/$archive" trellis trellis-server
          sha256sum "dist/$archive" > "dist/checksum-${version}-${target}-trellis.sha256"

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries.tar.gz
          retention-days: 1

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  rust:
    name: Rust
    needs: [install, wasm, portal, build, build-fixtures, dex]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_CACHE_DIR: ${{ github.workspace }}/target/trellis-nats-cache
      TRELLIS_TEST_NATS_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis
      TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis-server
      TRELLIS_TEST_EVENTS_BIN: ${{ github.workspace }}/dist/runtime-binaries/fixtures/events
      TRELLIS_TEST_DEX_BIN: ${{ github.workspace }}/dist/test-identity/dex
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download runtime and fixture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: check-*-binaries
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Extract runtime and fixture binaries
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-binaries
          tar -xzf "$RUNNER_TEMP/binaries/runtime-binaries.tar.gz" -C dist/runtime-binaries
          tar -xf "$RUNNER_TEMP/binaries/fixture-binaries.tar" -C dist/runtime-binaries

      - name: Download test identity provider
        uses: actions/download-artifact@v4
        with:
          name: check-dex
          path: dist/test-identity

      - name: Make test identity provider executable
        run: chmod +x dist/test-identity/dex

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Install Chromium for Rust-owned browser acceptance
        run: npx playwright install --with-deps chromium

      # Nextest runs every test binary in parallel instead of one binary at a
      # time; it does not run documentation examples, so those run separately.
      - name: Test Rust workspace
        run: cargo nextest run --manifest-path Cargo.toml --workspace --features trellis-rs/event-store-sqlite,trellis-rs/event-store-postgres --no-fail-fast

      - name: Test Rust documentation examples
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path Cargo.toml --workspace --features trellis-rs/event-store-sqlite,trellis-rs/event-store-postgres --doc

  typescript:
    name: TypeScript
    needs: [install, wasm, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download producer-built adapter-test runtime
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: dist

      - name: Extract producer-built adapter-test runtime
        run: mkdir -p dist/runtime-binaries && tar -xzf dist/runtime-binaries.tar.gz -C dist/runtime-binaries ./trellis ./trellis-server

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node workspace dependencies
        id: deps
        run: npm ci

      # The checks are independent: each one reports even when another fails.
      - name: Check TypeScript packages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:sdk

      - name: Check TypeScript integration
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:integration

      - name: Test TypeScript packages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis-server
        run: npm run test:sdk

  demos:
    name: Demo consumers
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Expose repository CLI
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: npm ci

      - name: Check TypeScript demos with packaged dependencies
        run: |
          npm run build:packages
          node --experimental-transform-types ts/tools/package_build/demo_consumers.ts

      - name: Verify TypeScript publication
        run: bash scripts/release-ts-dry-run.sh

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            ts/packages/result/npm
            ts/packages/trellis-testkit/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm
          retention-days: 3

      - name: Check Rust service demo
        working-directory: demos/rust/service
        run: |
          trellis generate
          cargo check --locked --config "$GITHUB_WORKSPACE/.cargo/publication.toml"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "$GITHUB_WORKSPACE/.cargo/publication.toml"

      - name: Check Rust device demo
        working-directory: demos/rust/device
        run: |
          trellis generate
          cargo check --locked --config "$GITHUB_WORKSPACE/.cargo/publication.toml"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "$GITHUB_WORKSPACE/.cargo/publication.toml"

  live-rust:
    name: Rust live integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run Rust live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: cargo test --manifest-path Cargo.toml -p trellis-rs --features live-integration --test integration -- --nocapture

  live-typescript:
    name: TypeScript live integration (${{ matrix.shard }}/8)
    needs: [install, wasm, portal, build, build-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run independent test files on separate hosted runners; every shard must pass.
    # Failures in one shard must not cancel another shard's functional evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download runtime and fixture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: check-*-binaries
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Stage runtime and fixture binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/binaries/runtime-binaries.tar.gz" -C target/debug
          tar -xf "$RUNNER_TEMP/binaries/fixture-binaries.tar" -C target/debug

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Run TypeScript live integration
        env:
          TRELLIS_TEST_SHARD: ${{ matrix.shard }}/8
          # Two active file workers per hosted runner. The suite mostly waits on
          # real authorization expiry, so more hosts shorten the slowest shard.
          TRELLIS_TEST_CONCURRENCY: "2"
        run: npm run test:integration

  examples:
    name: Documented examples
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

