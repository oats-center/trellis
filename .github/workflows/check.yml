          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Prepare web development server
        run: npm ci

      - name: Install pinned Chromium and browser dependencies
        working-directory: ts
        run: npm exec --yes --package=playwright@1.59.1 -- playwright install --with-deps chromium

      - name: Test built-in UI hosting
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: npm run test:browser:ui-hosting

      - name: Test functional browser journeys
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: npm run test:browser:auth

  console:
    name: Console (${{ matrix.suite }})
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - services_devices
          - clients_roles
          - users_sessions
          - observability
          - navigation_permissions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run console browser suite
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          SUITE: ${{ matrix.suite }}
        run: |
          npm ci
          node --experimental-transform-types --test \
            "ts/browser/console_${SUITE}.browser_test.ts"

      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-failure-${{ matrix.suite }}
