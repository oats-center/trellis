name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  install:
    name: Install generated artifacts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Reset isolated installation state
        run: rm -rf target

      - name: Cache installation build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-

      - name: Install generated artifacts
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install

      - name: Inspect generated artifact drift
        id: current
        shell: bash
        run: |
          if test -z "$(git status --porcelain)"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Upload installed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-generated
          path: |
            crates/runtime/trellis
            web/trellis
            ts/packages/trellis-testkit/trellis
            integration/fixtures/runtime/crates/runtime-trellis
            integration/fixtures/runtime/packages/runtime-trellis
            demos/rust/service/trellis
            demos/rust/device/trellis
            demos/ts/service/trellis
            demos/ts/device/trellis
            demos/app/trellis
            docs/examples/orders/trellis
          include-hidden-files: true
          retention-days: 1

  generated:
    name: Generated artifacts current
    needs: install
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require generated artifacts to be current
        env:
          GENERATED_CURRENT: ${{ needs.install.outputs.current }}
        run: test "$GENERATED_CURRENT" = true

  wasm:
    name: Protocol WASM
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build protocol WASM
        run: cargo run --manifest-path xtask/Cargo.toml -- protocol-wasm

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

  portal:
    name: Embedded browser apps
    needs: [install, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # The web build resolves SvelteKit's internal modules through the shared
      # ts/ import map, so the TypeScript workspace's node_modules must exist.
      - name: Install TypeScript workspace dependencies
        run: deno install --config ts/deno.json

      # Consume the already-generated API artifacts and protocol WASM; do not
      # re-run the developer wrapper that recompiles xtask and the WASM.
      - name: Build embedded browser apps
        run: deno task -c web/deno.json build:embedded

      - name: Upload embedded browser apps
        uses: actions/upload-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated
          retention-days: 1

  build:
    name: Build runtime binaries
    needs: [install, wasm, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-

      # One producer for the executables every live, browser, demo, package, and
      # image job runs. The release profile is shared by all of them; there is no
      # separate debug runtime. Build version-clean (official) so the CLI and
      # server report the same version the manifest records.
      - name: Build runtime binaries
        env:
          TRELLIS_OFFICIAL_BUILD: "1"
        run: cargo build --release --manifest-path Cargo.toml -p trellis-server -p trellis-cli

      # Cross-language helper/provider executables for the TypeScript integration
      # tests, plus the testkit live test binary. Built once here so the tests do
      # not compile Rust while they run.
      - name: Build integration fixture helpers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo build --bins \
            --manifest-path integration/fixtures/runtime/Cargo.toml \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

      - name: Build the testkit live test binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo test --no-run \
            --manifest-path integration/fixtures/testkit/Cargo.toml \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-testkit.path=\"$GITHUB_WORKSPACE/crates/trellis-testkit\"" \
            --test live \
            --message-format=json > "$RUNNER_TEMP/testkit-live.json"
          executable="$(jq -r 'select(.executable != null) | .executable' "$RUNNER_TEMP/testkit-live.json" | tail -n1)"
          if [ -z "${executable}" ] || [ "${executable}" = "null" ]; then
            echo "failed to locate the testkit live test binary" >&2
            exit 1
          fi
          cp "${executable}" target/debug/trellis-testkit-live

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-binaries/fixtures
          cp target/release/trellis target/release/trellis-server target/debug/trellis-testkit-live dist/runtime-binaries/
          for bin in trellis-runtime-acceptance caller resources events live_probe live_probe_caller empty_watch; do
            cp "target/debug/${bin}" dist/runtime-binaries/fixtures/
          done
          # Test helpers are debug builds with full debug info; strip it so the
          # shared artifact is a fraction of its size for every consumer.
          find dist/runtime-binaries -type f -exec strip --strip-unneeded {} + 2>/dev/null || true
          tar -C dist/runtime-binaries -czf dist/runtime-binaries.tar.gz .

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-runtime-binaries
          path: dist/runtime-binaries.tar.gz
          retention-days: 1

  rust:
    name: Rust
    needs: [install, wasm, portal]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Prime the pinned NATS cache
        # The transport broker tests start a real nats-server and resolve it from
        # TRELLIS_CACHE_DIR (or ~/.cache/trellis); otherwise the first one
        # downloads it while its siblings wait on the install lock, which can
        # outlast their 30s delivery bound on a loaded runner.
        run: |
          set -euo pipefail
          bash scripts/acquire-test-nats.sh --dest /tmp/trellis-testkit-nats
          version="$(jq -r '.["nats-server"].version' crates/local-nats/nats-binaries.json)"
          mkdir -p /tmp/trellis-nats-cache
          cp /tmp/trellis-testkit-nats/nats-server "/tmp/trellis-nats-cache/nats-server-v${version}"

      - name: Check formatting
        run: |
          cargo fmt --manifest-path Cargo.toml --all --check

      - name: Lint Rust
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        env:
          TRELLIS_CACHE_DIR: /tmp/trellis-nats-cache
        run: cargo test --manifest-path Cargo.toml --workspace

  typescript:
    name: TypeScript
    needs: [install, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check formatting
        run: deno fmt -c ts/deno.json --check

      - name: Check TypeScript packages
        run: >-
          deno check -c ts/deno.json
          ts/packages/trellis/index.ts
          ts/packages/trellis-svelte/src/index.ts
          ts/packages/trellis-svelte/src/context.svelte.ts
          ts/packages/trellis-testkit/index.ts

      - name: Check TypeScript integration
        run: deno task -c ts/integration/deno.json check

      - name: Test TypeScript packages
        run: deno task -c ts/deno.json test

  demos:
    name: Demo consumers
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Expose repository CLI
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check TypeScript demos with packaged dependencies
        run: |
          deno task -c ts/deno.json packages:build:npm:installed
          deno run -A -c ts/deno.json ts/tools/package_build/demo_consumers.ts

      - name: Verify TypeScript publication
        run: bash scripts/release-ts-dry-run.sh

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            ts/packages/result/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm
          retention-days: 3

      - name: Check Rust service demo
        working-directory: demos/rust/service
        run: |
          trellis generate
          cargo check --locked --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

      - name: Check Rust device demo
        working-directory: demos/rust/device
        run: |
          trellis generate
          cargo check --locked --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

  live-rust:
    name: Rust live integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run Rust live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: cargo test --manifest-path Cargo.toml -p trellis-rs --features live-integration --test integration -- --nocapture

  live-testkit:
    name: Rust testkit integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Acquire the pinned NATS executable
        # Stage under /tmp: the server rejects a --local-nats binary whose parent
        # directory is group/world writable without the sticky bit, and the
        # self-hosted runner's $RUNNER_TEMP and $HOME are world writable.
        run: bash scripts/acquire-test-nats.sh --dest /tmp/trellis-testkit-nats

      - name: Run the prebuilt testkit live binary with a host probe
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          TRELLIS_TEST_NATS_BIN: /tmp/trellis-testkit-nats/nats-server
          RUST_BACKTRACE: "1"
        run: |
          set +e
          probe_log="$RUNNER_TEMP/host-probe.log"
          : > "$probe_log"
          (
            while true; do
              echo "=== $(date -u +%H:%M:%S) ==="
              echo "loadavg: $(cat /proc/loadavg) nproc=$(nproc 2>/dev/null)"
              grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
              for pressure in cpu io memory; do
                [ -r "/proc/pressure/${pressure}" ] && echo "psi ${pressure}: $(cat "/proc/pressure/${pressure}")"
              done
              for cg in /sys/fs/cgroup/io.stat /sys/fs/cgroup/io.max /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max; do
                [ -r "$cg" ] && echo "cgroup $cg: $(tr '\n' '|' < "$cg")"
              done
              for pid in $(pgrep -x trellis-server 2>/dev/null; pgrep -x nats-server 2>/dev/null); do
                echo "io pid $pid $(grep -E 'read_bytes|write_bytes' "/proc/$pid/io" 2>/dev/null | tr '\n' ' ')"
              done
              df -h /tmp "$GITHUB_WORKSPACE" 2>/dev/null | tail -3
              vmstat 1 2 2>/dev/null | tail -1
              ps -eo pcpu,pmem,stat,comm --sort=-pcpu 2>/dev/null | head -12
              sleep 2
            done
          ) >> "$probe_log" 2>&1 &
          probe_pid=$!
          "$GITHUB_WORKSPACE/target/debug/trellis-testkit-live"
          status=$?
          kill "$probe_pid" 2>/dev/null || true
          wait "$probe_pid" 2>/dev/null || true
          echo "===== HOST PROBE (${probe_log}) ====="
          cat "$probe_log"
          exit "$status"

  live-typescript:
    name: TypeScript live integration
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Acquire the pinned NATS executable
        run: bash scripts/acquire-test-nats.sh --dest /tmp/trellis-testkit-nats

      - name: Run TypeScript live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          TRELLIS_TEST_NATS_BIN: /tmp/trellis-testkit-nats/nats-server
          TRELLIS_TEST_FIXTURE_BIN_DIR: ${{ github.workspace }}/target/debug/fixtures
          TRELLIS_TESTKIT_LIVE_BIN: ${{ github.workspace }}/target/debug/trellis-testkit-live
        run: deno task -c ts/deno.json test:integration

  examples:
    name: Documented examples
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify documented Orders service
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
        run: |
          deno task -c ts/packages/result/deno.json build:npm
          deno task -c ts/packages/trellis/deno.json build:npm:installed
          deno run -A -c ts/deno.json ts/tools/package_build/orders_example.ts

  ui-hosting:
