  rust-testkit-package:
    name: Rust testkit bundle
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify publication content comparison
        run: python3 scripts/tests/test_rust_crate_contents.py

      - name: Download production native archives
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: dist/native

      - name: Prepare testkit native acquisition metadata
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          python3 scripts/prepare-rust-native.py dist/native crates/trellis-testkit/generated/trellis-binaries.json "$version"

      - name: Package the public crates
        # Prepare the complete publication closure together. The required
        # artifact-only consumer compiles these unmodified archives and runs
        # their full live acceptance; Release compares its verified publication
        # contents against these accepted inputs before uploading each crate.
        run: |
          cargo package --manifest-path Cargo.toml --allow-dirty --locked --no-verify \
            -p trellis-protocol -p trellis-models -p trellis-rs -p trellis-testkit \
            --config .cargo/publication.toml

      - name: Verify publication preparation from an empty target
        run: |
          target="$(mktemp -d "$RUNNER_TEMP/rust-publication.XXXXXX")"
          bash scripts/prepare-rust-publication.sh target/package "$target" \
            trellis-protocol trellis-models trellis-rs trellis-testkit

      - name: Upload public Rust packages
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-packages
          path: target/package/*.crate
          retention-days: 3

      - name: Stage the verification bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/testkit-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/packages" "$bundle/nats" "$bundle/native" "$bundle/consumer"
          cp target/package/trellis-protocol-*.crate \
             target/package/trellis-models-*.crate \
             target/package/trellis-rs-*.crate \
             target/package/trellis-testkit-*.crate "$bundle/packages/"
          tar -xzf dist/native/trellis-*-x86_64-unknown-linux-gnu.tar.gz -C "$bundle/native"
          cp -R integration/fixtures/testkit/package-consumer \
             integration/fixtures/testkit/tests integration/fixtures/testkit/crates "$bundle/consumer/"
          cp -R integration/fixtures/compiler-portable "$bundle/consumer/compiler-project"
          bash scripts/acquire-test-nats.sh --dest "$bundle/nats"
          cp scripts/verify-rust-test-package.sh "$bundle/"

      - name: Package the verification bundle
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          bash scripts/stage-rust-test-bundle.sh \
            --bundle "$RUNNER_TEMP/testkit-bundle" \
            --output "$RUNNER_TEMP/rust-testkit-bundle.tar.gz" \
            --source-sha "$GITHUB_SHA" \
            --target "$(rustc -vV | sed -n 's/^host: //p')" \
            --version "$version"

      - name: Upload the verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-bundle
          path: ${{ runner.temp }}/rust-testkit-bundle.tar.gz
          retention-days: 3

  rust-testkit-consumer:
    name: Rust testkit artifact-only consumer
    needs: [rust-testkit-package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the verification bundle
        uses: actions/download-artifact@v4
        with:
          name: rust-testkit-bundle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract the verification bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf rust-testkit-bundle.tar.gz -C bundle --no-same-owner

      - name: Verify the packaged testkit without a checkout
        run: bash bundle/verify-rust-test-package.sh --bundle "$PWD/bundle" --mode full

  verify-images:
    name: Build verified ${{ matrix.image }} image
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis
            file: crates/runtime/Containerfile.release
            title: trellis
            description: Trellis Rust runtime
          - image: console
            file: web/Containerfile
            title: console
            description: Trellis administrative web console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download native Linux runtime archives
        if: matrix.image == 'trellis'
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/native-runtime

      - name: Stage native binaries for image assembly
        if: matrix.image == 'trellis'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/native-runtime" -maxdepth 1 -name 'trellis-*-x86_64-unknown-linux-gnu.tar.gz' | head -n1)"
          if [ -z "${archive}" ]; then
            echo "missing native Linux runtime archive for x86_64-unknown-linux-gnu" >&2
            exit 1
          fi
          mkdir -p dist/native/amd64
          tar --no-same-owner -xzf "${archive}" -C dist/native/amd64 trellis trellis-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build native trellis image for the managed-mode smoke
        if: matrix.image == 'trellis'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/runtime/Containerfile.release
          platforms: linux/amd64
          load: true
          tags: trellis-smoke:test
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}

      - name: Smoke-test managed NATS in the trellis image
        if: matrix.image == 'trellis'
        shell: bash
        run: bash scripts/smoke-trellis-image.sh --image trellis-smoke:test

      - name: Upload verified image archive
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          compression-level: 0
          retention-days: 3

  typescript-testkit-package:
    name: Stage exact TypeScript testkit release input
    needs: [install, wasm, demos, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: check-generated
      - uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
      - uses: actions/download-artifact@v4
        with:
          pattern: trellis-cli-*
          merge-multiple: true
          path: dist/native
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ts/packages
      - name: Generate pins from the verified Check archives and stage the package
        run: node ts/tools/stage_testkit.ts dist/native dist/testkit-npm
      - name: Dry-run the staged npm publication input
        run: npm publish --dry-run --access public --tag rc ./dist/testkit-npm
      - name: Test the installed staged package through public clients
        run: |
          mkdir -p dist/runtime
          tar -xzf dist/native/trellis-*-x86_64-unknown-linux-gnu.tar.gz -C dist/runtime
          TRELLIS_TEST_CLI_BIN="$PWD/dist/runtime/trellis" TRELLIS_TEST_SERVER_BIN="$PWD/dist/runtime/trellis-server" \
            node ts/tools/verify_testkit_package.ts dist/testkit-npm ts/packages/result/npm ts/packages/trellis/npm
      - name: Freeze the staged package
        run: tar -C dist/testkit-npm -czf dist/testkit-npm.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: check-testkit-npm
          path: dist/testkit-npm.tar.gz
          retention-days: 3

  acceptance:
    name: Acceptance gate
    needs:
      - changes
      - clippy
      - rust
      - typescript
      - demos
      - examples
      - ui-hosting
      - console
      - live-rust
      - live-typescript
      - rust-testkit-consumer
      - typescript-testkit-package
      - verify-images
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          # A prose-only pull request skips verification; nothing may fail.
          allowed = {"success"} if os.environ["CODE_CHANGED"] == "true" else {"success", "skipped"}
          if needs["changes"]["result"] != "success":
              allowed = {"success"}
          failed = {
              name: result.get("result")
              for name, result in needs.items()
              if result.get("result") not in allowed
          }
          if failed:
              print(f"verification did not all succeed: {failed}", file=sys.stderr)
              sys.exit(1)
          if os.environ["CODE_CHANGED"] != "true":
              print("only documentation changed; build and test verification skipped")
          else:
              print(f"all {len(needs)} verification jobs succeeded")
          PY
