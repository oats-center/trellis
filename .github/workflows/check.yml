      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Test built-in UI hosting
        working-directory: ts
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
        run: deno task test:browser:ui-hosting

      - name: Test functional browser journeys
        working-directory: ts
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: deno task test:browser:auth

  console:
    name: Console (${{ matrix.suite }})
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - services_devices
          - portals_grants
          - users_sessions
          - observability
          - navigation_permissions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run console browser suite
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          SUITE: ${{ matrix.suite }}
        run: |
          deno test -A -c ts/browser/deno.json \
            "ts/browser/console_${SUITE}.browser_test.ts"

      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-failure-${{ matrix.suite }}
          path: |
            ts/browser/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  rust-testkit-package:
    name: Rust testkit bundle
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Package the public crates
        # Verify the packaged crates against the workspace crates being released
        # rather than whatever versions crates.io currently holds: `cargo package`
        # ignores the manifest's [patch] section, so the patches are explicit.
        run: |
          cargo package --manifest-path Cargo.toml \
            -p trellis-protocol -p trellis-rs -p trellis-testkit \
            --config 'patch.crates-io.trellis-protocol.path="crates/protocol"' \
            --config 'patch.crates-io.trellis-rs.path="crates/trellis"'

      - name: Upload public Rust packages
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-packages
          path: target/package/*.crate
          retention-days: 3

      - name: Stage the verification bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/testkit-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/packages" "$bundle/binaries" "$bundle/nats" "$bundle/consumer"
          cp target/package/trellis-protocol-*.crate \
             target/package/trellis-rs-*.crate \
             target/package/trellis-testkit-*.crate "$bundle/packages/"
          cp target/debug/trellis target/debug/trellis-server "$bundle/binaries/"
          cp -R integration/fixtures/testkit/. "$bundle/consumer/"
          rm -rf "$bundle/consumer/target"
          bash scripts/acquire-test-nats.sh --dest "$bundle/nats"
          cp scripts/verify-rust-test-package.sh "$bundle/"

      - name: Package the verification bundle
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          bash scripts/stage-rust-test-bundle.sh \
            --bundle "$RUNNER_TEMP/testkit-bundle" \
            --output "$RUNNER_TEMP/rust-testkit-bundle.tar.gz" \
            --source-sha "$GITHUB_SHA" \
            --target "$(rustc -vV | sed -n 's/^host: //p')" \
            --version "$version"

      - name: Upload the verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-bundle
          path: ${{ runner.temp }}/rust-testkit-bundle.tar.gz
          retention-days: 3

  rust-testkit-consumer:
    name: Rust testkit artifact-only consumer
    needs: [rust-testkit-package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the verification bundle
        uses: actions/download-artifact@v4
        with:
          name: rust-testkit-bundle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract the verification bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf rust-testkit-bundle.tar.gz -C bundle --no-same-owner

      - name: Verify the packaged testkit without a checkout
        run: bash bundle/verify-rust-test-package.sh --bundle "$PWD/bundle" --mode full

  build-targets-linux:
    name: Build native Linux runtime (${{ matrix.arch }})
    needs: [install, wasm, portal]
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:bookworm
    timeout-minutes: 45
    env:
      TRELLIS_OFFICIAL_BUILD: "1"
      TRELLIS_BUILD_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # The runtime image base is debian:bookworm-slim, so compile in the same
      # release (rust:bookworm) on each native architecture.
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p trellis-cli -p trellis-server --target ${{ matrix.target }}

      - name: Package CLI archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="${{ matrix.target }}"
          staging="dist/${target}"
          mkdir -p "$staging"
          cp "target/${target}/release/trellis" "$staging/trellis"
          cp "target/${target}/release/trellis-server" "$staging/trellis-server"
          archive="trellis-${version}-${target}.tar.gz"
          tar -C "$staging" -czf "dist/$archive" trellis trellis-server
          sha256sum "dist/$archive" > "dist/checksum-${version}-${target}-trellis.sha256"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  build-targets-darwin:
    name: Build ${{ matrix.target }} CLI
    needs: [install, wasm, portal]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TRELLIS_OFFICIAL_BUILD: "1"
      TRELLIS_BUILD_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Add target toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p trellis-cli -p trellis-server --target ${{ matrix.target }}

      - name: Package CLI archives
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="${{ matrix.target }}"
          staging="dist/${target}"
          mkdir -p "$staging"
          cp "target/${target}/release/trellis" "$staging/trellis"
          cp "target/${target}/release/trellis-server" "$staging/trellis-server"
          archive="trellis-${version}-${target}.tar.gz"
          tar -C "$staging" -czf "dist/$archive" trellis trellis-server
          shasum -a 256 "dist/$archive" > "dist/checksum-${version}-${target}-trellis.sha256"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  verify-images:
    name: Build verified ${{ matrix.image }} image
    needs: [install, wasm, portal, build-targets-linux]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis
            file: crates/runtime/Containerfile
            title: trellis
            description: Trellis Rust runtime
          - image: console
            file: web/Containerfile
            title: console
            description: Trellis administrative web console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download native Linux runtime archives
        if: matrix.image == 'trellis'
        uses: actions/download-artifact@v4
        with:
          pattern: trellis-cli-*-unknown-linux-gnu
          merge-multiple: true
          path: ${{ runner.temp }}/native-runtime

      - name: Stage native binaries for image assembly
        if: matrix.image == 'trellis'
        shell: bash
        run: |
          set -euo pipefail
          declare -A arches=( [amd64]=x86_64-unknown-linux-gnu [arm64]=aarch64-unknown-linux-gnu )
          for arch in "${!arches[@]}"; do
            target="${arches[${arch}]}"
            archive="$(find "$RUNNER_TEMP/native-runtime" -maxdepth 1 -name "trellis-*-${target}.tar.gz" | head -n1)"
            if [ -z "${archive}" ]; then
              echo "missing native Linux runtime archive for ${target}" >&2
              exit 1
            fi
            mkdir -p "dist/native/${arch}"
            tar --no-same-owner -xzf "${archive}" -C "dist/native/${arch}" trellis trellis-server
          done
          ls -l dist/native/amd64 dist/native/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build native trellis image for the managed-mode smoke
        if: matrix.image == 'trellis'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/runtime/Containerfile
          platforms: linux/amd64
          load: true
          tags: trellis-smoke:test
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}

      - name: Smoke-test managed NATS in the trellis image
        if: matrix.image == 'trellis'
        shell: bash
        run: bash scripts/smoke-trellis-image.sh --image trellis-smoke:test

      - name: Upload verified image archive
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          compression-level: 0
          retention-days: 3

  smoke-image-arm64:
    name: Smoke the native arm64 runtime image
    needs: [install, wasm, portal, build-targets-linux]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download native arm64 runtime archive
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/native-runtime

      - name: Stage native binaries for image assembly
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/native-runtime" -maxdepth 1 -name 'trellis-*-aarch64-unknown-linux-gnu.tar.gz' | head -n1)"
          if [ -z "${archive}" ]; then
            echo "missing native Linux runtime archive for aarch64-unknown-linux-gnu" >&2
            exit 1
          fi
          mkdir -p dist/native/arm64
          tar --no-same-owner -xzf "${archive}" -C dist/native/arm64 trellis trellis-server

      # The multi-arch archive is assembled on x64 under emulation, so this is
      # the native ARM runtime evidence: assemble and smoke the arm64 image on a
      # native arm64 runner.
      - name: Build native arm64 trellis image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 \
            --tag trellis-smoke-arm64:test \
            --build-arg TRELLIS_VERSION="${{ github.ref_name }}" \
            --build-arg TRELLIS_REVISION="${{ github.sha }}" \
            --file crates/runtime/Containerfile .

      - name: Smoke-test managed NATS in the native arm64 image
        shell: bash
        run: bash scripts/smoke-trellis-image.sh --image trellis-smoke-arm64:test

  acceptance:
    name: Acceptance gate
    needs:
      - generated
      - rust
      - typescript
      - demos
      - examples
      - ui-hosting
      - console
      - live-rust
      - live-testkit
      - live-typescript
      - rust-testkit-consumer
      - build-targets-linux
      - build-targets-darwin
      - verify-images
      - smoke-image-arm64
    if: always()
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {
              name: result.get("result")
              for name, result in needs.items()
              if result.get("result") != "success"
          }
          if failed:
              print(f"verification did not all succeed: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"all {len(needs)} verification jobs succeeded")
          PY
