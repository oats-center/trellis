name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  install:
    name: Install generated artifacts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Reset isolated installation state
        run: rm -rf target

      - name: Cache installation build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-

      - name: Install generated artifacts
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install

      - name: Inspect generated artifact drift
        id: current
        shell: bash
        run: |
          if test -z "$(git status --porcelain)"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Upload installed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-generated
          path: |
            crates/runtime/trellis
            web/trellis
            ts/packages/trellis-test/trellis
            integration/fixtures/runtime/crates/runtime-trellis
            integration/fixtures/runtime/packages/runtime-trellis
            demos/rust/service/trellis
            demos/rust/device/trellis
            demos/ts/service/trellis
            demos/ts/device/trellis
            demos/app/trellis
            docs/examples/orders/trellis
          include-hidden-files: true
          retention-days: 1

  generated:
    name: Generated artifacts current
    needs: install
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require generated artifacts to be current
        env:
          GENERATED_CURRENT: ${{ needs.install.outputs.current }}
        run: test "$GENERATED_CURRENT" = true

  wasm:
    name: Protocol WASM
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build protocol WASM
        run: cargo run --manifest-path xtask/Cargo.toml -- protocol-wasm

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

  portal:
    name: Embedded browser apps
    needs: [install, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Consume the already-generated API artifacts and protocol WASM; do not
      # re-run the developer wrapper that recompiles xtask and the WASM.
      - name: Build embedded browser apps
        run: deno task -c web/deno.json build:embedded

      - name: Upload embedded browser apps
        uses: actions/upload-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated
          retention-days: 1

  build:
    name: Build runtime binaries
    needs: [install, wasm, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-runtime-binaries-

      # One producer for the executables every live, browser, demo, and package
      # job runs. Build version-clean (official) so the CLI and server report the
      # same version the manifest records.
      - name: Build runtime binaries
        env:
          TRELLIS_OFFICIAL_BUILD: "1"
        run: cargo build --manifest-path Cargo.toml -p trellis-server -p trellis-cli

      # Cross-language helper/provider executables for the TypeScript integration
      # tests, plus the testkit live test binary. Built once here so the tests do
      # not compile Rust while they run.
      - name: Build integration fixture helpers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo build --bins \
            --manifest-path integration/fixtures/runtime/Cargo.toml \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

      - name: Build the testkit live test binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo test --no-run \
            --manifest-path integration/fixtures/testkit/Cargo.toml \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-test.path=\"$GITHUB_WORKSPACE/crates/trellis-test\"" \
            --test live \
            --message-format=json > "$RUNNER_TEMP/testkit-live.json"
          executable="$(jq -r 'select(.executable != null) | .executable' "$RUNNER_TEMP/testkit-live.json" | tail -n1)"
          if [ -z "${executable}" ] || [ "${executable}" = "null" ]; then
            echo "failed to locate the testkit live test binary" >&2
            exit 1
          fi
          cp "${executable}" target/debug/trellis-testkit-live

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-binaries/fixtures
          cp target/debug/trellis target/debug/trellis-server target/debug/trellis-testkit-live dist/runtime-binaries/
          for bin in trellis-runtime-acceptance caller resources events live_probe live_probe_caller empty_watch; do
            cp "target/debug/${bin}" dist/runtime-binaries/fixtures/
          done
          tar -C dist/runtime-binaries -czf dist/runtime-binaries.tar.gz .

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-runtime-binaries
          path: dist/runtime-binaries.tar.gz
          retention-days: 1

  rust:
    name: Rust
    needs: [install, wasm, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Check formatting
        run: |
          cargo fmt --manifest-path Cargo.toml --all --check

      - name: Lint Rust
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path Cargo.toml --workspace

  typescript:
    name: TypeScript
    needs: [install, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check formatting
        run: deno fmt -c ts/deno.json --check

      - name: Check TypeScript packages
        run: >-
          deno check -c ts/deno.json
          ts/packages/trellis/index.ts
          ts/packages/trellis-svelte/src/index.ts
          ts/packages/trellis-svelte/src/context.svelte.ts
          ts/packages/trellis-test/index.ts

      - name: Check TypeScript integration
        run: deno task -c ts/integration/deno.json check

      - name: Test TypeScript packages
        run: deno task -c ts/deno.json test

  demos:
    name: Demo consumers
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Expose repository CLI
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check TypeScript demos with packaged dependencies
        run: |
          deno task -c ts/deno.json packages:build:npm:installed
          deno run -A -c ts/deno.json ts/tools/package_build/demo_consumers.ts

      - name: Verify TypeScript publication
        run: bash scripts/release-ts-dry-run.sh

      - name: Check Rust service demo
        working-directory: demos/rust/service
        run: |
          trellis generate
          cargo check --locked --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

      - name: Check Rust device demo
        working-directory: demos/rust/device
        run: |
          trellis generate
          cargo check --locked --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cp -R Cargo.toml src trellis "$consumer/"
          export PATH="$(dirname "$(rustup which cargo)"):/usr/bin:/bin"
          export TRELLIS_CACHE="$consumer/empty-api-cache"
          cd "$consumer"
          cargo check --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\""

  live-rust:
    name: Rust live integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run Rust live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: cargo test --manifest-path Cargo.toml -p trellis-rs --features live-integration --test integration -- --nocapture

  live-testkit:
    name: Rust testkit integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Acquire the pinned NATS executable
        # Stage under /tmp: the server rejects a --local-nats binary whose parent
        # directory is group/world writable without the sticky bit, and the
        # self-hosted runner's $RUNNER_TEMP and $HOME are world writable.
        run: bash scripts/acquire-test-nats.sh --dest /tmp/trellis-test-nats

      - name: Run the prebuilt testkit live binary
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          TRELLIS_TEST_NATS_BIN: /tmp/trellis-test-nats/nats-server
        run: ${{ github.workspace }}/target/debug/trellis-testkit-live

  live-typescript:
    name: TypeScript live integration
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Acquire the pinned NATS executable
        run: bash scripts/acquire-test-nats.sh --dest /tmp/trellis-test-nats

      - name: Run TypeScript live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          TRELLIS_TEST_NATS_BIN: /tmp/trellis-test-nats/nats-server
          TRELLIS_TEST_FIXTURE_BIN_DIR: ${{ github.workspace }}/target/debug/fixtures
          TRELLIS_TESTKIT_LIVE_BIN: ${{ github.workspace }}/target/debug/trellis-testkit-live
        run: deno task -c ts/deno.json test:integration

  examples:
    name: Documented examples
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify documented Orders service
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
        run: |
          deno task -c ts/packages/result/deno.json build:npm
          deno task -c ts/packages/trellis/deno.json build:npm:installed
          deno run -A -c ts/deno.json ts/tools/package_build/orders_example.ts

  ui-hosting:
    name: Built-in UI hosting
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Test built-in UI hosting
        working-directory: ts
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
        run: deno task test:browser:ui-hosting

      - name: Test functional browser journeys
        working-directory: ts
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: deno task test:browser:auth

  console:
    name: Console (${{ matrix.suite }})
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - services_devices
          - portals_grants
          - users_sessions
          - observability
          - navigation_permissions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run console browser suite
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          SUITE: ${{ matrix.suite }}
        run: |
          deno test -A -c ts/browser/deno.json \
            "ts/browser/console_${SUITE}.browser_test.ts"

      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-failure-${{ matrix.suite }}
          path: |
            ts/browser/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  rust-testkit-package:
    name: Rust testkit bundle
    needs: [install, wasm, portal, build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download embedded browser apps
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Package the public crates
        run: cargo package --manifest-path Cargo.toml -p trellis-protocol -p trellis-rs -p trellis-test

      - name: Stage the verification bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/testkit-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/packages" "$bundle/binaries" "$bundle/nats" "$bundle/consumer"
          cp target/package/trellis-protocol-*.crate \
             target/package/trellis-rs-*.crate \
             target/package/trellis-test-*.crate "$bundle/packages/"
          cp target/debug/trellis target/debug/trellis-server "$bundle/binaries/"
          cp -R integration/fixtures/testkit/. "$bundle/consumer/"
          rm -rf "$bundle/consumer/target"
          bash scripts/acquire-test-nats.sh --dest "$bundle/nats"
          cp scripts/verify-rust-test-package.sh "$bundle/"

      - name: Package the verification bundle
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          bash scripts/stage-rust-test-bundle.sh \
            --bundle "$RUNNER_TEMP/testkit-bundle" \
            --output "$RUNNER_TEMP/rust-testkit-bundle.tar.gz" \
            --source-sha "$GITHUB_SHA" \
            --target "$(rustc -vV | sed -n 's/^host: //p')" \
            --version "$version"

      - name: Upload the verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-bundle
          path: ${{ runner.temp }}/rust-testkit-bundle.tar.gz
          retention-days: 3

  rust-testkit-consumer:
    name: Rust testkit artifact-only consumer
    needs: [rust-testkit-package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the verification bundle
        uses: actions/download-artifact@v4
        with:
          name: rust-testkit-bundle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract the verification bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf rust-testkit-bundle.tar.gz -C bundle --no-same-owner

      - name: Verify the packaged testkit without a checkout
        run: bash bundle/verify-rust-test-package.sh --bundle "$PWD/bundle" --mode full
