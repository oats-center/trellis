name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release artifacts and packages"
        required: false
        default: false
        type: boolean
      tag:
        description: "Tag to publish when running manually (for example v0.100.0-rc.1)"
        required: false
        type: string
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_TERM_COLOR: always
  DENO_VERSION: 2.9.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24
  REGISTRY: ghcr.io

jobs:
  resolve-release:
    name: Resolve release marker
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: [self-hosted, Linux, X64]
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-version: ${{ steps.release.outputs.version }}
      release-base-version: ${{ steps.release.outputs.base-version }}
      should-publish: ${{ steps.release.outputs.should-publish }}
      should-create-tag: ${{ steps.release.outputs.should-create-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release marker
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          release_tag=""
          should_publish=false
          should_create_tag=false

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            release_tag="${INPUT_TAG}"
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              should_publish=true
            fi
          else
            case "${GITHUB_REF}" in
              refs/heads/release/v*)
                release_tag="${GITHUB_REF_NAME#release/}"
                should_publish=true
                should_create_tag=true
                ;;
            esac
          fi

          if [ -n "${release_tag}" ] && [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Invalid release tag '${release_tag}'; expected vX.Y.Z or vX.Y.Z-rc.1"
            exit 1
          fi

          version=""
          base_version=""
          if [ -n "${release_tag}" ]; then
            version="${release_tag#v}"
            base_version="${version%%[-+]*}"
          fi

          if [ "${should_create_tag}" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Release tag ${release_tag} already exists. Delete the release branch or choose a new version."
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "base-version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "should-publish=${should_publish}" >> "${GITHUB_OUTPUT}"
          echo "should-create-tag=${should_create_tag}" >> "${GITHUB_OUTPUT}"

  prepare-release:
    name: Prepare release workspace
    needs: resolve-release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      release-tag: ${{ needs.resolve-release.outputs.release-tag }}
      release-version: ${{ needs.resolve-release.outputs.release-version }}
      release-base-version: ${{ needs.resolve-release.outputs.release-base-version }}
      should-publish: ${{ needs.resolve-release.outputs.should-publish }}
      should-create-tag: ${{ needs.resolve-release.outputs.should-create-tag }}
      check-run-id: ${{ steps.check.outputs.run-id }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release-tag }}
      SHOULD_PUBLISH: ${{ needs.resolve-release.outputs.should-publish }}
      SHOULD_CREATE_TAG: ${{ needs.resolve-release.outputs.should-create-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publication consumes the artifacts of the successful Check run for this
      # exact candidate. It never builds the product and never falls back to
      # "the latest green Check".
      - name: Resolve the accepted Check run
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          query="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          runs_file="${RUNNER_TEMP}/check-runs.json"
          deadline=$((SECONDS + 5400))
          run_id=""
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${query}" -o "${runs_file}"
            run_id="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_attempt) | last | .id // empty' "${runs_file}")"
            if [ -n "${run_id}" ]; then
              break
            fi
            latest_status="$(jq -r '[.workflow_runs[]] | sort_by(.run_attempt) | last | .status // empty' "${runs_file}")"
            if [ "${latest_status}" = "completed" ]; then
              echo "::error::The Check run for ${GITHUB_SHA} completed without success; refusing to publish."
              exit 1
            fi
            sleep 30
          done
          if [ -z "${run_id}" ]; then
            echo "::error::Timed out waiting for a successful Check run for ${GITHUB_SHA}."
            exit 1
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            cargo run --manifest-path xtask/Cargo.toml -- release check-metadata --version "${RELEASE_TAG#v}"
          else
            cargo run --manifest-path xtask/Cargo.toml -- release check-metadata
          fi

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        run: cargo run --manifest-path xtask/Cargo.toml -- release write-notes --tag "${RELEASE_TAG}" --output "${{ github.workspace }}/dist/release-notes.md"

      - name: Upload release notes
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  release-gate:
    name: Release gate
    needs:
      - prepare-release
    if: needs.prepare-release.result == 'success'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Confirm the candidate was accepted by Check
        run: printf 'Publication input is the accepted Check run for this candidate.\n'

  create-release-tag:
    name: Create release tag
    if: needs.prepare-release.outputs.should-create-tag == 'true'
    needs:
      - prepare-release
      - release-gate
      - publish-apis
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${RELEASE_TAG} already exists."
            exit 1
          fi

          branch_ref="refs/heads/release/${RELEASE_TAG}"
          branch_line="$(git ls-remote --heads origin "${branch_ref}")"
          branch_sha="${branch_line%%$'\t'*}"
          if [ "${branch_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release branch ${branch_ref} points to ${branch_sha:-nothing}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          git tag "${RELEASE_TAG}" "${EXPECTED_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

          branch_line="$(git ls-remote --heads origin "${branch_ref}")"
          branch_sha="${branch_line%%$'\t'*}"
          if [ "${branch_sha}" != "${EXPECTED_SHA}" ]; then
            git push origin ":refs/tags/${RELEASE_TAG}" || true
            echo "::error::Release branch ${branch_ref} moved to ${branch_sha:-nothing} while creating ${RELEASE_TAG}; deleted the new tag before publishing."
            exit 1
          fi

          remote_line="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          remote_sha="${remote_line%%$'\t'*}"
          if [ "${remote_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} points to ${remote_sha}, expected ${EXPECTED_SHA}."
            exit 1
          fi

  github-release:
    name: Publish GitHub release
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success' && needs.publish-apis.result == 'success' && (needs.prepare-release.outputs.should-create-tag != 'true' || needs.create-release-tag.result == 'success')
    needs:
      - prepare-release
      - release-gate
      - create-release-tag
      - publish-apis
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download packaged CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: trellis-cli-*
          merge-multiple: true
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.prepare-release.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(needs.prepare-release.outputs.release-tag, '-') }}

  publish-crates:
    name: Publish Rust crates
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - github-release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        shell: bash
        working-directory: .
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          workspace_version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          published=()
          skipped=()

          crate_exists() {
            local crate="$1"
            local version="$2"
            curl --silent --show-error --fail "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          wait_for_crate_index() {
            local crate="$1"
            local version="$2"

            for attempt in {1..30}; do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                return 0
              fi
              printf 'Waiting for %s@%s to appear in the crates.io index (%s/30)\n' "$crate" "$version" "$attempt"
              sleep 10
            done

            echo "::error::${crate}@${version} did not appear in the crates.io index"
            return 1
          }

          record_skip() {
            local crate="$1"
            echo "Skipping ${crate}@${workspace_version} (already published)"
            skipped+=("${crate}@${workspace_version}")
            wait_for_crate_index "$crate" "$workspace_version"
          }

          record_publish() {
            local crate="$1"
            published+=("${crate}@${workspace_version}")
          }

          run_publish() {
            local crate="$1"
            shift
            local output
            local status

            time cargo publish --allow-dirty --dry-run "$@"

            set +e
            output=$(time cargo publish --allow-dirty "$@" 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              record_publish "$crate"
              wait_for_crate_index "$crate" "$workspace_version"
              return 0
            fi

            if printf '%s\n' "$output" | grep -Fq "already exists on crates.io index"; then
              record_skip "$crate"
              return 0
            fi

            return "$status"
          }

          publish_workspace_crate() {
            local crate="$1"

            if crate_exists "$crate" "$workspace_version"; then
              record_skip "$crate"
              return 0
            fi

            run_publish "$crate" -p "$crate"
          }

          publish_workspace_crate trellis-protocol
          # run_publish waits for protocol to enter the index before this contracts dry-run.
          publish_workspace_crate trellis-rs
          # The public testkit follows the facade into the index.
          publish_workspace_crate trellis-testkit

          echo "Published ${#published[@]} crate(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} crate(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-apis:
    name: Publish canonical APIs
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success'
    needs:
      - prepare-release
      - release-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packaged CLI
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/cli
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Stage the CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          tar -xzf "$RUNNER_TEMP/cli/"trellis-*.tar.gz -C "$GITHUB_WORKSPACE/bin" trellis

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APIs
        shell: bash
        run: |
          set -euo pipefail
          trellis="$GITHUB_WORKSPACE/bin/trellis"
          # The canonical APIs live in one native package (`crates/runtime`,
          # package `trellis`); the other crates and TypeScript packages are
          # generated consumers and carry no publishable `trellis.toml`.
          (cd crates/runtime && "$trellis" publish)

  publish-npm:
    name: Publish npm packages
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: .
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          npm_tag=latest
          published=()
          skipped=()

          package_already_exists() {
            local package_name="$1"
            local package_version="$2"
            npm view "${package_name}@${package_version}" version >/dev/null 2>&1
          }

          publish_or_skip() {
            local pkg="$1"
            local name="$2"
            local version="$3"
            local output
            local status

            if package_already_exists "$name" "$version"; then
              echo "Skipping $name@$version (already published)"
              skipped+=("$name@$version")
              return 0
            fi

            set +e
            output=$(npm publish --access public --tag "$npm_tag" "$pkg" 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              published+=("$name@$version")
              return 0
            fi

            if printf '%s\n' "$output" | grep -Eqi 'cannot publish over|previously published version|cannot modify pre-existing version|you cannot publish over'; then
              echo "Skipping $name@$version (already published)"
              skipped+=("$name@$version")
              return 0
            fi

            return "$status"
          }

          if [[ "${RELEASE_TAG}" == *-* ]]; then
            npm_tag=rc
          fi

          packages=(
            ts/packages/result/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm
          )
          for pkg in "${packages[@]}"; do
            package_json="$pkg/package.json"
            name=$(node -p "require('./${package_json}').name")
            version=$(node -p "require('./${package_json}').version")
            publish_or_skip "$pkg" "$name" "$version"
          done

          echo "Published ${#published[@]} package(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} package(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-jsr:
    name: Publish JSR packages
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - github-release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ts/node_modules
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('ts/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Publish JSR packages
        shell: bash
        run: |
          set -euo pipefail
          published=()
          skipped=()

          package_field() {
            local manifest="$1"
            local field="$2"
            deno eval 'const manifest = JSON.parse(await Deno.readTextFile(Deno.args[0])); console.log(manifest[Deno.args[1]]);' "$manifest" "$field"
          }

          jsr_package_exists() {
            local package_name="$1"
            local package_version="$2"
            curl -fsL -o /dev/null "https://jsr.io/${package_name}/${package_version}_meta.json"
          }

          wait_for_jsr_package() {
            local package_name="$1"
            local package_version="$2"

            for attempt in {1..30}; do
              if jsr_package_exists "$package_name" "$package_version"; then
                return 0
              fi
              printf 'Waiting for %s@%s to appear on JSR (%s/30)\n' "$package_name" "$package_version" "$attempt"
              sleep 10
            done

            echo "::error::${package_name}@${package_version} did not appear on JSR"
            return 1
          }

          publish_or_skip() {
            local package_dir="$1"
            local manifest="${package_dir}/deno.json"
            local package_name
            local package_version
            package_name="$(package_field "$manifest" name)"
            package_version="$(package_field "$manifest" version)"

            if jsr_package_exists "$package_name" "$package_version"; then
              echo "Skipping ${package_name}@${package_version} (already published)"
              skipped+=("${package_name}@${package_version}")
              wait_for_jsr_package "$package_name" "$package_version"
              return 0
            fi

            (cd "$package_dir" && time deno publish --allow-slow-types --allow-dirty)
            published+=("${package_name}@${package_version}")
            wait_for_jsr_package "$package_name" "$package_version"
          }

          publish_or_skip ts/packages/result
          publish_or_skip ts/packages/trellis
          publish_or_skip ts/packages/trellis-test

          TRELLIS_SVELTE_JSR_RUNTIME_DEPENDENCY_VERSION="${RELEASE_VERSION}" \
            deno task -c ts/packages/trellis-svelte/deno.json build:npm
          publish_or_skip ts/packages/trellis-svelte/jsr

          echo "Published ${#published[@]} JSR package(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} JSR package(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-images:
    name: Publish ${{ matrix.image }} image
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - release-gate
      - github-release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis
          - image: console

    steps:
      - name: Download verified image archive
        uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp
          run-id: ${{ needs.prepare-release.outputs.check-run-id }}
          github-token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}

      - name: Normalize image owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          echo "value=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up image promotion
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=sha,prefix=sha-
            type=raw,value=rc,enable=${{ env.RELEASE_TAG != '' && contains(env.RELEASE_TAG, '-') }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !contains(env.RELEASE_TAG, '-') }}

      - name: Promote verified image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/skopeo-auth.json"
          printf '%s' "${REGISTRY_PASSWORD}" | skopeo login --authfile "${auth_file}" --username "${REGISTRY_USER}" --password-stdin "${REGISTRY}"
          while IFS= read -r image_tag; do
            [ -n "${image_tag}" ] || continue
            skopeo copy --all --dest-authfile "${auth_file}" "oci-archive:/tmp/${{ matrix.image }}.tar" "docker://${image_tag}"
          done <<< "${IMAGE_TAGS}"
