name: Pipeline

# One workflow builds, verifies and, on a `release/v*` push, publishes. The file
# keeps the name release.yml because crates.io and npm trusted publishing name
# it; renaming it requires updating those publisher settings first.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A release run is never cancelled midway through publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  NODE_VERSION: 26
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  REGISTRY: ghcr.io
  # CI debug/test artifacts retain file-and-line backtraces, not full DWARF.
  # Production release optimization and debug assertions remain unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  # Formatting and the dependency check need no generated artifacts, so they
  # never hold back a build.
  lint:
    name: Formatting and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install formatter
        run: npm ci --ignore-scripts

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The same command local `npm test` runs; every check reports even when
      # another fails.
      - name: Check formatting
        run: bash scripts/check.sh lint

  # A pull request that touches only prose skips the build and test graph; the
  # docs job builds the site whenever the docs or design docs change, and the
  # acceptance gate still reports. A main push of a commit a `release/v*` run
  # already verified skips both: this job waits for that run's acceptance gate
  # and skips only when it succeeded. Otherwise, and for every other push or
  # manual run, verification runs in full.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    # Long enough to wait out the release run's verification.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.release.outputs.branch == '' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
      docs: ${{ steps.release.outputs.branch == '' && (github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true') }}
      release: ${{ steps.release.outputs.branch }}
    steps:
      - name: Find a release run that verified this commit
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The release branch is pushed first, so its run may still be
          # starting or verifying; wait for its acceptance gate.
          deadline=$((SECONDS + 140 * 60))
          while :; do
            runs="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/release.yml/runs" \
              -f head_sha="$SHA" -f event=push -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_branch | startswith("release/v")) | {id, branch: .head_branch, status}]')"
            pending=false
            for run in $(jq -r '.[] | @base64' <<<"$runs"); do
              id="$(base64 -d <<<"$run" | jq -r .id)"
              gate="$(gh api "repos/$REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "Acceptance gate")][0].conclusion // ""')"
              if [ "$gate" = success ]; then
                echo "branch=$(base64 -d <<<"$run" | jq -r .branch)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ -z "$gate" ] && [ "$(base64 -d <<<"$run" | jq -r .status)" != completed ]; then
                pending=true
              fi
            done
            # A release branch at this commit whose run has not appeared yet.
            if [ "$(jq length <<<"$runs")" = 0 ] && git ls-remote "https://github.com/$REPOSITORY" 'refs/heads/release/v*' |
              awk -v sha="$SHA" '$1 == sha { found = 1 } END { exit !found }'; then
              pending=true
            fi
            if [ "$pending" != true ]; then
              echo "No release run verified $SHA; verifying here"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The release run did not finish verifying $SHA in time; verifying here"
              break
            fi
            sleep 60
          done
          echo "branch=" >> "$GITHUB_OUTPUT"

      # Markdown and the other prose skip the code graph; site code does not.
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!design/**'
              - '!docs/src/**/*.md'
              - '!docs/static/**'
              - '!*.md'
            docs:
              - '{docs/**,design/**,package.json,package-lock.json}'

  # The site the Pages workflow deploys from main, built the same way.
  docs:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the site's dependencies
        run: npm ci --workspace @trellis/docs --include-workspace-root --ignore-scripts --no-audit --no-fund

      - name: Check and build the site
        run: |
          set -euo pipefail
          npm run check --workspace @trellis/docs
          npm run build --workspace @trellis/docs

  install:
    name: Generate artifacts, protocol WASM and browser apps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "trellis-build"]') }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ so Cargo rebuilds only what changed.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Keep the build output, never stale generated files or downloads. A
      # runner whose environment sets TRELLIS_CI_TARGET_ROOT shares each job's
      # target/ with the other runners on its host.
      - name: Remove untracked files except target/
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffdx --exclude=/target/
          if [ -n "${TRELLIS_CI_TARGET_ROOT:-}" ]; then
            mkdir -p "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB"
            [ -L target ] || rm -rf target
            ln -sfn "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB" target
          fi

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Self-hosted runners keep target/ instead.
      - name: Cache installation build
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-

      # One job and one target/ build xtask once for the generated artifacts and
      # the protocol WASM.
      - name: Install generated artifacts and the protocol WASM
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install

      - name: Report installation cache input size
        if: always()
        run: du -sh target 2>/dev/null || true

      - name: Upload installed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: check-generated
          path: |
            crates/trellis/generated
            crates/models/generated
            crates/trellis-testkit/generated
            crates/runtime-apis/generated
            ts/packages/trellis-testkit/trellis
            integration/fixtures/runtime/packages/runtime-trellis
            integration/fixtures/runtime/v2/packages/runtime-trellis
            integration/fixtures/runtime-pinned/packages/runtime-trellis
            integration/fixtures/runtime-removed/packages/runtime-trellis
            integration/fixtures/client-upgrade/packages/client-upgrade
            integration/fixtures/client-upgrade-narrow/packages/client-upgrade
            integration/fixtures/client-upgrade-consent/packages/client-upgrade
            integration/fixtures/client-upgrade-breaking/packages/client-upgrade
            integration/fixtures/testkit/crates/trellis-test-fixture
            integration/fixtures/testkit/packages/trellis-test-fixture
            benchmarks/runtime/crates/performance-trellis
            benchmarks/runtime/packages/performance-trellis
            ts/packages/trellis/internal_sdk/generated
            demos/rust/service/trellis
            demos/rust/device/trellis
            demos/ts/service/trellis
            demos/ts/device/trellis
            demos/app/trellis
            docs/examples/orders/trellis
          include-hidden-files: true
          retention-days: 1

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v7
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

      - name: Install Node workspace dependencies
        run: npm ci

      # The runtime binaries embed the Console and Portal, built from the
      # artifacts generated above without recompiling xtask or the WASM.
      - name: Build embedded browser apps
        run: npm run browser:embedded

      - name: Upload embedded browser apps
        uses: actions/upload-artifact@v7
        with:
          name: check-portal
          path: crates/runtime/generated
          retention-days: 1

  clippy:
    name: Rust lint
    needs: [install]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "trellis-build"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ so Cargo rebuilds only what changed.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Keep the build output, never stale generated files or downloads. A
      # runner whose environment sets TRELLIS_CI_TARGET_ROOT shares each job's
      # target/ with the other runners on its host.
      - name: Remove untracked files except target/
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffdx --exclude=/target/
          if [ -n "${TRELLIS_CI_TARGET_ROOT:-}" ]; then
            mkdir -p "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB"
            [ -L target ] || rm -rf target
            ln -sfn "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB" target
          fi

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          portal: true

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Self-hosted runners keep target/ instead.
      - name: Cache Rust lint artifacts
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-

      # Each verification command lives in scripts/check.sh, which local
      # `npm test` runs too.
      - name: Lint Rust
        run: bash scripts/check.sh clippy

  build-fixtures:
    name: Build integration fixture binaries
    needs: [install]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "trellis-build"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ so Cargo rebuilds only what changed.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Keep the build output, never stale generated files or downloads. A
      # runner whose environment sets TRELLIS_CI_TARGET_ROOT shares each job's
      # target/ with the other runners on its host.
      - name: Remove untracked files except target/
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffdx --exclude=/target/
          if [ -n "${TRELLIS_CI_TARGET_ROOT:-}" ]; then
            mkdir -p "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB"
            [ -L target ] || rm -rf target
            ln -sfn "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB" target
          fi

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          portal: true

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      # Self-hosted runners keep target/ instead.
      - name: Cache fixture build artifacts
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'integration/fixtures/**/Cargo.toml', 'integration/fixtures/**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-

      # Cross-language helper/provider executables for the TypeScript integration
      # tests, the testkit live test binary and the health_watch example. Built
      # once here so the tests do not compile Rust while they run.
      - name: Build integration fixture helpers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo build --bins \
            --manifest-path integration/fixtures/runtime/Cargo.toml \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\""
          cargo build --manifest-path Cargo.toml -p trellis-runtime --example health_watch

      - name: Build the testkit test binaries
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo test --no-run \
            --manifest-path integration/fixtures/testkit/Cargo.toml \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\"" \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-testkit.path=\"$GITHUB_WORKSPACE/crates/trellis-testkit\"" \
            --tests \
            --message-format=json > "$RUNNER_TEMP/testkit-tests.json"
          mkdir -p target/debug/testkit-tests
          jq -r 'select(.executable != null and .target.kind[0] == "test") | "\(.target.name) \(.executable)"' \
            "$RUNNER_TEMP/testkit-tests.json" > "$RUNNER_TEMP/testkit-tests.txt"
          while read -r name executable; do
            if [ "$name" = live ]; then
              cp "$executable" target/debug/trellis-testkit-live
            else
              cp "$executable" "target/debug/testkit-tests/$name"
            fi
          done < "$RUNNER_TEMP/testkit-tests.txt"
          [ -x target/debug/trellis-testkit-live ] || {
            echo "failed to locate the testkit live test binary" >&2
            exit 1
          }

      # Multithreaded zstd instead of the upload's single-threaded compression;
      # the tar preserves executable modes.
      - name: Stage fixture binaries
        run: |
          set -euo pipefail
          umask 077
          staging="$RUNNER_TEMP/fixture-binaries"
          rm -rf "$staging"
          mkdir -p "$staging/fixtures" "$staging/examples"
          cp target/debug/trellis-testkit-live "$staging/"
          cp -R target/debug/testkit-tests "$staging/"
          for bin in trellis-runtime-acceptance caller resources events live_probe live_probe_caller live_application_versions empty_watch finite_rpc rpc_distribution operation_target operation_storage_upload operation_lease_loss device_companion transport_growth_subject transport_growth_operation transfer_generation stream_transfer jobs service_update configured_growth; do
            cp "target/debug/${bin}" "$staging/fixtures/"
          done
          cp target/debug/examples/health_watch "$staging/examples/"
          find "$staging" -type f -exec strip --strip-unneeded {} +
          tar -C "$staging" -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/fixture-binaries.tar.zst"

      - name: Upload fixture binaries
        uses: actions/upload-artifact@v7
        with:
          name: check-fixture-binaries
          path: ${{ runner.temp }}/fixture-binaries.tar.zst
          compression-level: 0
          retention-days: 1

  build:
    name: Build runtime binaries
    needs: [install]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "trellis-build"]') }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ so Cargo rebuilds only what changed.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Keep the build output, never stale generated files or downloads. A
      # runner whose environment sets TRELLIS_CI_TARGET_ROOT shares each job's
      # target/ with the other runners on its host.
      - name: Remove untracked files except target/
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffdx --exclude=/target/
          if [ -n "${TRELLIS_CI_TARGET_ROOT:-}" ]; then
            mkdir -p "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB"
            [ -L target ] || rm -rf target
            ln -sfn "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB" target
          fi

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      # The one release build every live, browser, demo, package, and image job
      # runs, compiled against the runtime image's Debian bookworm glibc. See
      # crates/runtime/Containerfile.build for why it is a container build.
      - name: Build release binaries
        run: |
          set -euo pipefail
          docker buildx build --builder default --pull \
            --file crates/runtime/Containerfile.build \
            --output "type=local,dest=$RUNNER_TEMP/release" \
            .

      - name: Stage runtime binaries and CLI archives
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/runtime-binaries"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$RUNNER_TEMP/release/trellis" "$RUNNER_TEMP/release/trellis-server" "$staging/"
          bash scripts/acquire-test-nats.sh --dest "$staging/nats"
          tar -C "$staging" -czf "$RUNNER_TEMP/runtime-binaries.tar.gz" .
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="x86_64-unknown-linux-gnu"
          mkdir -p dist
          # One archive per binary, named after it: the CLI's self-update finds
          # trellis-<version>-<target>.tar.gz.
          for binary in trellis trellis-server; do
            archive="${binary}-${version}-${target}.tar.gz"
            tar -C "$RUNNER_TEMP/release" -czf "dist/$archive" "$binary"
            # A bare file name, so `sha256sum -c` works beside the download.
            (cd dist && sha256sum "$archive" > "checksum-${version}-${target}-${binary}.sha256")
          done

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v7
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries.tar.gz
          retention-days: 1

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  # The same container release build on a native arm64 runner, for the arm64
  # release archives and the arm64 half of the trellis-server image. Only the
  # x86-64 build is tested.
  build-arm64:
    name: Build arm64 runtime binaries
    needs: [install]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      - name: Build release binaries
        run: |
          set -euo pipefail
          docker buildx build --builder default --pull \
            --file crates/runtime/Containerfile.build \
            --output "type=local,dest=$RUNNER_TEMP/release" \
            .

      - name: Stage CLI archives
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="aarch64-unknown-linux-gnu"
          mkdir -p dist
          for binary in trellis trellis-server; do
            archive="${binary}-${version}-${target}.tar.gz"
            tar -C "$RUNNER_TEMP/release" -czf "dist/$archive" "$binary"
            (cd dist && sha256sum "$archive" > "checksum-${version}-${target}-${binary}.sha256")
          done

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: trellis-cli-aarch64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  rust:
    name: Rust tests
    needs: [install, build, build-fixtures]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "trellis-build"]') }}
    timeout-minutes: 45
    env:
      NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_CACHE_DIR: ${{ github.workspace }}/target/trellis-nats-cache
      TRELLIS_TEST_NATS_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis
      TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis-server
      TRELLIS_TEST_EVENTS_BIN: ${{ github.workspace }}/dist/runtime-binaries/fixtures/events
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ so Cargo rebuilds only what changed.
          clean: ${{ runner.environment == 'github-hosted' }}

      # Keep the build output, never stale generated files or downloads. A
      # runner whose environment sets TRELLIS_CI_TARGET_ROOT shares each job's
      # target/ with the other runners on its host.
      - name: Remove untracked files except target/
        if: runner.environment == 'self-hosted'
        run: |
          git clean -ffdx --exclude=/target/
          if [ -n "${TRELLIS_CI_TARGET_ROOT:-}" ]; then
            mkdir -p "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB"
            [ -L target ] || rm -rf target
            ln -sfn "$TRELLIS_CI_TARGET_ROOT/$GITHUB_JOB" target
          fi

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true
          node: true

      - name: Download runtime and fixture binaries
        uses: actions/download-artifact@v8
        with:
          pattern: check-*-binaries
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Extract runtime and fixture binaries
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-binaries
          tar -xzf "$RUNNER_TEMP/binaries/runtime-binaries.tar.gz" -C dist/runtime-binaries
          tar --zstd -xf "$RUNNER_TEMP/binaries/fixture-binaries.tar.zst" -C dist/runtime-binaries

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Cache Rust build artifacts
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-

      - name: Install Node workspace dependencies
        run: npm ci

      # The hosts' shared browser directory is read-only to the runners; keep
      # each runner's browsers in its own persistent tool cache instead.
      - name: Keep Playwright browsers in the runner's tool cache
        if: runner.environment == 'self-hosted'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"

      - name: Install Chromium for Rust-owned browser acceptance
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Provide NSS certutil for generated-CA browser trust
        run: command -v certutil >/dev/null || sudo apt-get install --yes --no-install-recommends libnss3-tools

      # Nextest runs every test binary in parallel instead of one binary at a
      # time; it does not run documentation examples, so those run separately.
      # A failing test's output then says what its clients and fixtures were
      # waiting on; nextest shows a test's output only when it fails.
      - name: Test Rust workspace
        env:
          RUST_LOG: warn,trellis_rs=debug
        run: bash scripts/check.sh rust

