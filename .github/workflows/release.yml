  verify-images:
    name: Build verified ${{ matrix.image }} image
    needs: [install, build, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis-server
            file: crates/runtime/Containerfile.release
            title: trellis-server
            description: Trellis Rust runtime
          - image: console
            file: web/Containerfile
            title: console
            description: Trellis administrative web console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      - name: Download native Linux runtime archives
        if: matrix.image == 'trellis-server'
        uses: actions/download-artifact@v8
        with:
          pattern: trellis-cli-*-unknown-linux-gnu
          merge-multiple: true
          path: ${{ runner.temp }}/native-runtime

      - name: Stage native binaries for image assembly
        if: matrix.image == 'trellis-server'
        shell: bash
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            mkdir -p "dist/native/${pair%%:*}"
            for binary in trellis trellis-server; do
              tar --no-same-owner -xzf "$RUNNER_TEMP/native-runtime/${binary}-"[0-9]*-"${pair#*:}"-unknown-linux-gnu.tar.gz \
                -C "dist/native/${pair%%:*}" "$binary"
            done
          done

      # Each image's arm64 half runs a few package and file commands under
      # emulation; nothing is compiled there.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build native trellis image for the managed-mode smoke
        if: matrix.image == 'trellis-server'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/runtime/Containerfile.release
          platforms: linux/amd64
          load: true
          tags: trellis-smoke:test
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}

      - name: Smoke-test managed NATS in the trellis image
        if: matrix.image == 'trellis-server'
        shell: bash
        run: bash scripts/check.sh images --smoke-only

      # The image index digest publication pushes and checks the registry for.
      - name: Record the verified image digest
        run: tar -xOf /tmp/${{ matrix.image }}.tar index.json | jq -jr '.manifests[0].digest' > /tmp/${{ matrix.image }}.digest

      - name: Upload verified image archive
        uses: actions/upload-artifact@v7
        with:
          name: verified-image-${{ matrix.image }}
          path: |
            /tmp/${{ matrix.image }}.tar
            /tmp/${{ matrix.image }}.digest
          compression-level: 0
          retention-days: 3

      - name: Upload verified image digest
        uses: actions/upload-artifact@v7
        with:
          name: verified-image-digest-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.digest
          retention-days: 3

  # The packed npm packages in an empty consumer on the oldest and newest
  # Node majors their engines accept; the rest of the pipeline runs on 26.
  typescript-testkit-package:
    name: npm packages on Node ${{ matrix.node }}
    needs: [install, demos, build]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          node: true

      - name: Download the CLI archive
        uses: actions/download-artifact@v8
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: dist/native

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Download the npm packages the demos verified
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm

      - name: Test the packed packages in a fresh project
        run: bash scripts/check.sh typescript-testkit

  acceptance:
    name: Acceptance gate
    needs:
      - changes
      - lint
      - docs
      - clippy
      - rust
      - typescript-checks
      - demos
      - examples
      - browser
      - typescript-tests
      - testkit-tests
      - rust-testkit-consumer
      - typescript-testkit-package
      - build-arm64
      - verify-images
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          RELEASE_BRANCH: ${{ needs.changes.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          # A job may be skipped only when the change detection said it was
          # not needed; nothing may fail.
          failed="$(jq -c --arg code "$CODE_CHANGED" --arg docs "$DOCS_CHANGED" '
            with_entries(
              (if .key == "changes" or .key == "lint" then "true"
                elif .key == "docs" then $docs else $code end) as $required
              | select(.value.result != "success"
                and ($required == "true" or .value.result != "skipped")))
            | map_values(.result)' <<<"$NEEDS")"
          if [[ "$failed" != "{}" ]]; then
            echo "verification did not all succeed: $failed" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_BRANCH" ]]; then
            echo "the $RELEASE_BRANCH run verifies this commit; verification skipped here"
          elif [[ "$CODE_CHANGED" != "true" ]]; then
            echo "only documentation changed; build and test verification skipped"
          else
            echo "all $(jq length <<<"$NEEDS") verification jobs succeeded"
          fi

  # Publication runs only for a `release/vX.Y.Z[-rc.N]` push, after every
  # verification job, from this run's artifacts; it never rebuilds the product
  # or verifies again, so a version that passed the gate publishes in full.
  # Each component uploads the exact bytes verification recorded, and a
  # version stays invisible until every component is available: the GitHub
  # release is a draft, and its tag, the image `rc` and `latest` tags and the
  # docs site follow only after the crates, images and npm packages publish.
  # A failed publish step is resumed with "Re-run failed jobs": each step
  # compares what a registry already holds with the verified artifact, skips
  # it when identical and fails when it differs; it never overwrites a
  # published version.
  release-metadata:
    name: Release metadata
    if: startsWith(github.ref, 'refs/heads/release/v')
    needs: [rust-testkit-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release branch '$GITHUB_REF_NAME'; expected release/vX.Y.Z or release/vX.Y.Z-rc.N"
            exit 1
          fi
          # The tag appears only when the finished release is published.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists; choose a new version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # `latest` follows the newest prerelease until a stable release exists.
          stable="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq length)"
          if [[ "$tag" != *-* || "$stable" == 0 ]]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release metadata and write the notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cargo xtask release check-metadata --version "${RELEASE_TAG#v}"
          cargo xtask release write-notes --tag "$RELEASE_TAG" --output dist/release-notes.md

      - name: Download the verified public crates
        uses: actions/download-artifact@v8
        with:
          name: rust-testkit-packages
          path: ${{ runner.temp }}/crates

      # Publication skips a version crates.io already has, so a crate whose
      # contents changed under a kept version would never reach anyone. Every
      # publish job waits on this job, so a mismatch publishes nothing.
      - name: Require published crate versions to match
        run: cargo xtask release check-published --packages "$RUNNER_TEMP/crates"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes.md

  publish-apis:
    name: Publish canonical APIs
    needs: [acceptance, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the CLI archive
        uses: actions/download-artifact@v8
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/cli

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The canonical APIs live in one native package (`crates/builtin-contracts`,
      # package `trellis`); the other crates and TypeScript packages are
      # generated consumers and carry no publishable `trellis.toml`. `trellis
      # publish` skips a version GHCR already holds with the same content and
      # refuses one with different content.
      - name: Publish APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cli/"trellis-[0-9]*.tar.gz -C "$RUNNER_TEMP/bin" trellis
          cd crates/builtin-contracts
          "$RUNNER_TEMP/bin/trellis" publish

  draft-release:
    name: Draft GitHub release
    needs: [acceptance, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: trellis-cli-*-unknown-linux-gnu
          merge-multiple: true
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist

      # A draft names its target commit; publishing it later creates the tag.
      - name: Upload missing assets and verify existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          branch="$(git ls-remote "https://github.com/$GH_REPO" "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$branch" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved to ${branch:-nothing}; this run verified $GITHUB_SHA."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md "${flags[@]}"
          fi
          release="$(gh release view "$RELEASE_TAG" --json assets,isDraft,targetCommitish)"
          target="$(jq -r .targetCommitish <<<"$release")"
          if [ "$(jq -r .isDraft <<<"$release")" = true ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::The $RELEASE_TAG draft targets $target, not $GITHUB_SHA; delete the draft to release this commit."
            exit 1
          fi
          existing="$(mktemp -d "$RUNNER_TEMP/existing-release.XXXXXX")"
          missing=()
          for asset in dist/trellis-*.tar.gz dist/checksum-*.sha256; do
            name="$(basename "$asset")"
            if jq -e --arg name "$name" '.assets | any(.name == $name)' <<<"$release" >/dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp "$asset" "$existing/$name"
            else
              missing+=("$asset")
            fi
          done
          # Never overwrite published bytes, including after a partial upload.
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi

  publish-crates:
    name: Publish Rust crates
    needs: [release-metadata, publish-apis, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore generated inputs
        uses: actions/download-artifact@v8
        with:
          name: check-generated

      - name: Download the verified public crates
        uses: actions/download-artifact@v8
        with:
          name: rust-testkit-packages
          path: ${{ runner.temp }}/crates

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # A resumed run first proves that what crates.io already holds is what
      # this run verified.
      - name: Compare published versions with the verified crates
        run: cargo xtask release check-published --packages "$RUNNER_TEMP/crates"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # `cargo publish` packages the checkout again, so each package is first
      # required to carry exactly the verified archive's files.
      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          crate_versions="$(cargo metadata --format-version 1 --no-deps --locked)"

          wait_for_index() {
            for attempt in {1..30}; do
              if cargo info "$1@$2" >/dev/null 2>&1; then return 0; fi
              printf 'Waiting for %s@%s in the crates.io index (%s/30)\n' "$1" "$2" "$attempt"
              sleep 10
            done
            echo "::error::$1@$2 did not appear in the crates.io index"
            return 1
          }

          crates=(trellis-protocol trellis-models trellis-rs trellis-testkit)
          declare -A version missing
          for crate in "${crates[@]}"; do
            version[$crate]="$(jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<<"$crate_versions")"
            # crates.io refuses API requests without a User-Agent (403), which
            # would read as unpublished.
            if curl --silent --fail --user-agent "trellis-release (https://github.com/oats-center/trellis)" \
              "https://crates.io/api/v1/crates/$crate/${version[$crate]}" >/dev/null; then
              echo "Skipping $crate@${version[$crate]} (already published and matching)"
              continue
            fi
            missing[$crate]=1
            # Every package must match before the first upload.
            archive="target/package/$crate-${version[$crate]}.crate"
            rm -f -- "$archive"
            cargo package --no-verify --allow-dirty --locked --config .cargo/publication.toml -p "$crate"
            cargo xtask release compare-crate "$RUNNER_TEMP/crates/$crate-${version[$crate]}.crate" "$archive"
          done

          # Each dependency reaches the index before its consumer publishes.
          for crate in "${crates[@]}"; do
            if [ -n "${missing[$crate]:-}" ]; then
              # The acceptance gate already built and tested these sources.
              cargo publish --no-verify --allow-dirty --locked --config .cargo/publication.toml -p "$crate"
            fi
            wait_for_index "$crate" "${version[$crate]}"
          done

      - name: Require the published crates to match the verified ones
        run: cargo xtask release check-published --packages "$RUNNER_TEMP/crates"

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: [release-metadata, publish-apis, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        image: [trellis-server, console]
    steps:
      - name: Download the verified image archive
        uses: actions/download-artifact@v8
        with:
          name: verified-image-${{ matrix.image }}
          path: ${{ runner.temp }}/image

      # Only the version's own tags here; `rc` and `latest` move once every
      # component is published.
      - name: Push the verified image by digest
        shell: bash
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/image/$IMAGE.tar"
          digest="$(cat "$RUNNER_TEMP/image/$IMAGE.digest")"
          if [ "$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest')" != "$digest" ]; then
            echo "::error::$IMAGE.tar is not the verified image $digest"
            exit 1
          fi
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          ref="$REGISTRY/$owner/$IMAGE"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install --yes skopeo; }
          auth="$RUNNER_TEMP/skopeo-auth.json"
          printf '%s' "$REGISTRY_PASSWORD" |
            skopeo login --authfile "$auth" --username "$REGISTRY_USER" --password-stdin "$REGISTRY"
          # The digest a tag points at, or nothing when the tag does not exist.
          tagged() {
            local manifest
            if manifest="$(skopeo inspect --authfile "$auth" --raw "docker://$ref:$1" 2>"$RUNNER_TEMP/inspect.err")"; then
              printf 'sha256:%s' "$(printf '%s' "$manifest" | sha256sum | cut -d ' ' -f1)"
            elif grep -qi 'manifest unknown' "$RUNNER_TEMP/inspect.err"; then
              return 0
            else
              cat "$RUNNER_TEMP/inspect.err" >&2
              return 1
            fi
          }
          source="oci-archive:$archive"
          for tag in "$RELEASE_TAG" "sha-${GITHUB_SHA:0:7}"; do
            existing="$(tagged "$tag")"
            if [ -z "$existing" ]; then
              skopeo copy --all --preserve-digests --dest-authfile "$auth" "$source" "docker://$ref:$tag"
              existing="$(tagged "$tag")"
            fi
            if [ "$existing" != "$digest" ]; then
              echo "::error::$ref:$tag is $existing, not the verified $digest"
              exit 1
            fi
            echo "$ref:$tag is the verified $digest"
          done

  # npm trusted publishing authorizes `npm publish` only, so a package's
  # dist-tag is set as it publishes; the packages publish after every other
  # registry upload succeeded.
  publish-npm:
    name: Publish npm packages
    needs: [release-metadata, publish-crates, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      LATEST: ${{ needs.release-metadata.outputs.latest }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the verified npm packages
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm

      # Each tarball is the one the demos job packed and dry-ran. Before
      # anything uploads, every tarball's sha512 must equal the integrity
      # recorded then, and a version npm already holds must carry it too.
      - name: Publish the verified tarballs
        shell: bash
        working-directory: ${{ runner.temp }}/npm
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$LATEST" != true ]]; then npm_tag=rc; fi
          missing=()
          for entry in $(jq -r '.[] | @base64' packages.json); do
            field() { base64 -d <<<"$entry" | jq -r ".$1"; }
            name="$(field name)" version="$(field version)" file="$(field filename)" integrity="$(field integrity)"
            actual="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            if [ "$actual" != "$integrity" ]; then
              echo "::error::$file is $actual, not the verified $integrity"
              exit 1
            fi
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [ -z "$published" ]; then
              missing+=("$file")
            elif [ "$published" = "$integrity" ]; then
              echo "Skipping $name@$version (already published with the verified integrity)"
            else
              echo "::error::$name@$version is already published as $published, not the verified $integrity"
              exit 1
            fi
          done
          # In dependency order, as packages.json lists them.
          for file in "${missing[@]}"; do
            npm publish --access public --tag "$npm_tag" "./$file"
          done

  # Every component is available: move the image channels, then publish the
  # GitHub release, which creates its tag on the verified commit.
  publish-release:
    name: Publish GitHub release
    needs: [release-metadata, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      LATEST: ${{ needs.release-metadata.outputs.latest }}
    steps:
      - name: Download the verified image digests
        uses: actions/download-artifact@v8
        with:
          pattern: verified-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Tag the image channels
        shell: bash
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then tags+=(rc); fi
          if [[ "$LATEST" == true ]]; then tags+=(latest); fi
          [ "${#tags[@]}" -gt 0 ] || exit 0
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install --yes skopeo; }
          auth="$RUNNER_TEMP/skopeo-auth.json"
          printf '%s' "$REGISTRY_PASSWORD" |
            skopeo login --authfile "$auth" --username "$REGISTRY_USER" --password-stdin "$REGISTRY"
          for image in trellis-server console; do
            digest="$(cat "$RUNNER_TEMP/digests/$image.digest")"
            for tag in "${tags[@]}"; do
              skopeo copy --all --preserve-digests --src-authfile "$auth" --dest-authfile "$auth" \
                "docker://$REGISTRY/$owner/$image@$digest" "docker://$REGISTRY/$owner/$image:$tag"
            done
          done

      - name: Publish the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            flags=()
            # GitHub never marks a prerelease as latest.
            if [[ "$RELEASE_TAG" != *-* ]]; then flags+=(--latest); fi
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          fi
          tagged="$(git ls-remote "https://github.com/$GH_REPO" "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$RELEASE_TAG points to ${tagged:-nothing}, not $GITHUB_SHA."
            exit 1
          fi

  publish-docs:
    name: Publish the docs site
    needs: [release-metadata, publish-release]
    # The site follows `latest`: stable releases, and prereleases until the
    # first stable release exists.
    if: needs.release-metadata.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the site from the new release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
