name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release artifacts and packages"
        required: false
        default: false
        type: boolean
      tag:
        description: "Tag to publish when running manually (for example v0.100.0-rc.1)"
        required: false
        type: string
  push:
    branches:
      - "release/v*"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "art/**"
      - "conformance/**"
      - "integration/**"
      - "ts/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "xtask/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_TERM_COLOR: always
  DENO_VERSION: 2.9.4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24
  REGISTRY: ghcr.io

jobs:
  resolve-release:
    name: Resolve release marker
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: [self-hosted, Linux, X64]
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-version: ${{ steps.release.outputs.version }}
      release-base-version: ${{ steps.release.outputs.base-version }}
      should-publish: ${{ steps.release.outputs.should-publish }}
      should-create-tag: ${{ steps.release.outputs.should-create-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release marker
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          release_tag=""
          should_publish=false
          should_create_tag=false

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            release_tag="${INPUT_TAG}"
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              should_publish=true
            fi
          else
            case "${GITHUB_REF}" in
              refs/heads/release/v*)
                release_tag="${GITHUB_REF_NAME#release/}"
                should_publish=true
                should_create_tag=true
                ;;
            esac
          fi

          if [ -n "${release_tag}" ] && [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Invalid release tag '${release_tag}'; expected vX.Y.Z or vX.Y.Z-rc.1"
            exit 1
          fi

          version=""
          base_version=""
          if [ -n "${release_tag}" ]; then
            version="${release_tag#v}"
            base_version="${version%%[-+]*}"
          fi

          if [ "${should_create_tag}" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Release tag ${release_tag} already exists. Delete the release branch or choose a new version."
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "base-version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "should-publish=${should_publish}" >> "${GITHUB_OUTPUT}"
          echo "should-create-tag=${should_create_tag}" >> "${GITHUB_OUTPUT}"

  prepare-release:
    name: Prepare release workspace
    needs: resolve-release
    runs-on: [self-hosted, Linux, X64]
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-version: ${{ steps.release.outputs.version }}
      release-base-version: ${{ steps.release.outputs.base-version }}
      should-publish: ${{ steps.release.outputs.should-publish }}
      should-create-tag: ${{ steps.release.outputs.should-create-tag }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release-tag }}
      SHOULD_PUBLISH: ${{ needs.resolve-release.outputs.should-publish }}
      SHOULD_CREATE_TAG: ${{ needs.resolve-release.outputs.should-create-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ts/node_modules
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('ts/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Prepare release version
        run: time cargo run --manifest-path xtask/Cargo.toml -- release prepare --tag "${RELEASE_TAG}"

      - name: Install release API dependencies
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" time cargo xtask install --update

      - name: Build protocol WASM
        run: time cargo run --manifest-path xtask/Cargo.toml -- protocol-wasm

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Capture release outputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.resolve-release.outputs.release-version }}" >> "$GITHUB_OUTPUT"
          echo "base-version=${{ needs.resolve-release.outputs.release-base-version }}" >> "$GITHUB_OUTPUT"
          echo "should-publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "should-create-tag=${SHOULD_CREATE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            time cargo run --manifest-path xtask/Cargo.toml -- release check-metadata --version "${RELEASE_TAG#v}"
          else
            time cargo run --manifest-path xtask/Cargo.toml -- release check-metadata
          fi

      - name: Build embedded browser apps
        run: deno task -c ts/deno.json browser:embedded

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        run: time cargo run --manifest-path xtask/Cargo.toml -- release write-notes --tag "${RELEASE_TAG}" --output "${{ github.workspace }}/dist/release-notes.md"

      - name: Upload prepared release workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          include-hidden-files: true
          path: |
            .dockerignore
            CHANGELOG.md
            art
            conformance
            demos/ts
            demos/app
            ts
            web
            crates
            Cargo.toml
            Cargo.lock
            .cargo
            scripts
            xtask
            !**/.svelte-kit/**
            !**/node_modules/**
            !**/target/**

      - name: Upload release notes
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  package-rust:
    name: Verify Rust package
    needs: prepare-release
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify publishable Rust packages
        run: |
          cargo package --manifest-path Cargo.toml --allow-dirty \
            -p trellis-protocol \
            -p trellis-rs

  package-js:
    name: Verify JavaScript packages
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ts/node_modules
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('ts/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build npm packages from installed sources
        run: deno task -c ts/deno.json packages:build:npm:installed

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime for live package consumer verification
        run: cargo build --manifest-path Cargo.toml -p trellis-server

      - name: Verify built package surfaces
        run: deno task -c ts/deno.json test:packaging:built

      - name: Verify TypeScript publication
        run: bash scripts/release-ts-dry-run.sh

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            ts/packages/result/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm

  build-cli:
    name: Build ${{ matrix.target }} CLI
    if: needs.prepare-release.outputs.release-tag != ''
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Add target toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build release binaries
        shell: bash
        env:
          TRELLIS_OFFICIAL_BUILD: "1"
          TRELLIS_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            time cargo build -p trellis-cli -p trellis-server --release --target ${{ matrix.target }}
          else
            time cargo build -p trellis-cli -p trellis-server --release --locked --target ${{ matrix.target }}
          fi
        working-directory: .

      - name: Package CLI archives
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-${GITHUB_REF_NAME:-dev}}"
          target="${{ matrix.target }}"
          archive_version="${version//\//-}"
          staging="dist/${target}"
          mkdir -p "$staging"

          cp "target/${target}/release/trellis" "$staging/trellis"
          cp "target/${target}/release/trellis-server" "$staging/trellis-server"
          archive="trellis-${archive_version}-${target}.tar.gz"
          tar -C "$staging" -czf "dist/$archive" trellis trellis-server
          shasum -a 256 "dist/$archive" > "dist/checksum-${archive_version}-${target}-trellis.sha256"

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  verify-images:
    name: Build verified ${{ matrix.image }} image
    if: needs.prepare-release.outputs.release-tag != ''
    needs: prepare-release
    runs-on: [self-hosted, Linux, X64]
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis
            file: crates/runtime/Containerfile
            title: trellis
            description: Trellis Rust runtime
          - image: console
            file: web/Containerfile
            title: console
            description: Trellis administrative web console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          build-args: |
            TRELLIS_VERSION=${{ env.RELEASE_TAG }}
            TRELLIS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      # The managed-mode smoke needs a named, single-platform image in the local
      # Docker daemon. The multi-arch OCI archive above cannot be loaded by name
      # (buildx's oci exporter leaves the images untagged and the archive is not a
      # docker-loadable single image), so the trellis image is rebuilt natively for
      # linux/amd64 with `load: true`, reusing the same build cache. Both
      # architectures are still proven by the OCI archive build above; the smoke only
      # runs the native amd64 image.
      - name: Build native trellis image for the managed-mode smoke
        if: matrix.image == 'trellis'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/runtime/Containerfile
          platforms: linux/amd64
          load: true
          tags: trellis-smoke:test
          build-args: |
            TRELLIS_VERSION=${{ env.RELEASE_TAG }}
            TRELLIS_REVISION=${{ github.sha }}

      - name: Smoke-test managed NATS in the trellis image
        if: matrix.image == 'trellis'
        shell: bash
        env:
          IMAGE: trellis-smoke:test
          BUNDLE_VOLUME: trellis-bundle
          STATE_VOLUME: trellis-state
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f trellis-smoke-run >/dev/null 2>&1 || true
            docker volume rm "${BUNDLE_VOLUME}" >/dev/null 2>&1 || true
            docker volume rm "${STATE_VOLUME}" >/dev/null 2>&1 || true
            docker image rm "${IMAGE}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # 1. Baked nats-server matches the pinned version; both binaries run.
          nats_version="$(docker run --rm --entrypoint nats-server "${IMAGE}" --version)"
          expected_nats_version="$(jq -r '.["nats-server"].version' crates/local-nats/nats-binaries.json)"
          case "${nats_version}" in *"v${expected_nats_version}"*) ;; *)
            echo "nats-server version mismatch: got '${nats_version}', expected v${expected_nats_version}" >&2
            exit 1
            ;;
          esac
          trellis_version="$(docker run --rm --entrypoint trellis "${IMAGE}" --version)"
          test -n "${trellis_version}"
          server_version="$(docker run --rm --entrypoint trellis-server "${IMAGE}" --version)"
          test -n "${server_version}"

          # 2. Generate a bundle into the state volume, owned by the image's
          #    non-root user, then copy it into its own named volume. System path
          #    defaults keep mutable SQLite state out of the read-only bundle.
          docker volume create "${BUNDLE_VOLUME}" >/dev/null
          docker volume create "${STATE_VOLUME}" >/dev/null
          docker run --rm --user root --entrypoint chown -v "${STATE_VOLUME}":/var/lib/trellis \
            "${IMAGE}" -R 10001:10001 /var/lib/trellis
          docker run --rm --user 10001:10001 --entrypoint trellis \
            -v "${STATE_VOLUME}":/var/lib/trellis "${IMAGE}" \
            init config --out /var/lib/trellis/bundle
          docker run --rm --user root --entrypoint cp \
            -v "${STATE_VOLUME}":/from:ro -v "${BUNDLE_VOLUME}":/to "${IMAGE}" \
            -a /from/bundle/. /to/
          # The bundle's creds/secrets are 0o600 and generated as 10001, but the
          # copy helper runs as root and the bundle volume root is root-owned:
          # the run container uid must own the bundle contents to read them.
          docker run --rm --user root --entrypoint chown \
            -v "${BUNDLE_VOLUME}":/to "${IMAGE}" \
            -R 10001:10001 /to

          # 3. Managed-mode run: non-root user, read-only rootfs, read-only
          #    bundle volume, writable state volume. All mutable NATS files go
          #    to /var/lib/trellis/nats via the system profile and the runtime's
          #    SQLite stores to /var/lib/trellis/data (config rewritten above).
          #    Private runtime and log directories are created inside portable
          #    sticky tmpfs parents by the non-root service user.
          docker run --detach --name trellis-smoke-run --read-only --tmpfs /tmp \
            --tmpfs /run:mode=1777 \
            --tmpfs /var/log:mode=1777 \
            --user 10001:10001 \
            --publish 127.0.0.1::3000 \
            --volume "${BUNDLE_VOLUME}":/etc/trellis:ro,Z \
            --volume "${STATE_VOLUME}":/var/lib/trellis:rw,Z \
            --entrypoint sh "${IMAGE}" -c \
              'mkdir -m 0700 /run/trellis /var/log/trellis; exec trellis-server --system all --local-nats=/usr/local/bin/nats-server'

          # 4. Wait for runtime readiness on the published port.
          runtime_port="$(docker port trellis-smoke-run 3000/tcp | cut -d: -f2)"
          ready=""
          for attempt in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:${runtime_port}/readyz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! docker inspect trellis-smoke-run >/dev/null 2>&1; then
              echo "trellis-smoke-run exited during startup" >&2
              docker logs trellis-smoke-run >&2 || true
              exit 1
            fi
            sleep 2
          done
          if [ -z "${ready}" ]; then
            echo "timed out waiting for runtime readiness" >&2
            docker logs trellis-smoke-run >&2 || true
            exit 1
          fi

          # 5. Graceful stop: SIGTERM, wait up to 30s, then check the exit code.
          docker stop --time 30 trellis-smoke-run >/dev/null
          exit_code="$(docker wait trellis-smoke-run)"
          if [ "${exit_code}" != "0" ]; then
            echo "trellis-smoke-run exited with ${exit_code} instead of 0" >&2
            docker logs trellis-smoke-run >&2 || true
            exit 1
          fi

          # 6. No startup or write errors in the logs.
          logs="$(docker logs trellis-smoke-run 2>&1)"
          if grep -Ei 'read-only|readonly|permission denied|failed to (write|create|open)' <<<"${logs}"; then
            echo "unexpected write/startup error in the smoke logs" >&2
            printf '%s\n' "${logs}" >&2
            exit 1
          fi

          # 7. Mutable NATS state landed in the state volume; the pid file was
          #    removed on shutdown; the bundle volume stayed untouched; the
          #    runtime's SQLite databases landed in the system data root.
          docker run --rm --entrypoint sh \
            -v "${BUNDLE_VOLUME}":/etc/trellis:ro,Z \
            -v "${STATE_VOLUME}":/var/lib/trellis:rw,Z "${IMAGE}" -c '
              set -eu
              test -f /var/lib/trellis/nats/nats.conf
              test -f /var/lib/trellis/nats/jwt.conf
              test -d /var/lib/trellis/nats/data/jwt
              test -d /var/lib/trellis/nats/data/jetstream
              test ! -e /var/lib/trellis/nats/nats-server.pid
              test ! -e /etc/trellis/nats/nats.local.conf
              test ! -e /etc/trellis/nats/jwt.local.conf
              test -f /var/lib/trellis/platform.sqlite
              test ! -e /etc/trellis/platform.sqlite
            '
          echo "managed NATS image smoke passed"

      - name: Upload verified image archive
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          compression-level: 0

  release-gate:
    name: Release gate
    needs:
      - prepare-release
      - package-rust
      - package-js
      - build-cli
      - verify-images
    if: >-
      always()
      && needs.package-rust.result == 'success'
      && needs.package-js.result == 'success'
      && (
        needs.prepare-release.outputs.release-tag == ''
        || (needs.build-cli.result == 'success' && needs.verify-images.result == 'success')
      )
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Confirm release verification passed
        run: printf 'Release verification passed.\n'

  create-release-tag:
    name: Create release tag
    if: needs.prepare-release.outputs.should-create-tag == 'true'
    needs:
      - prepare-release
      - release-gate
      - publish-apis
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${RELEASE_TAG} already exists."
            exit 1
          fi

          branch_ref="refs/heads/release/${RELEASE_TAG}"
          branch_line="$(git ls-remote --heads origin "${branch_ref}")"
          branch_sha="${branch_line%%$'\t'*}"
          if [ "${branch_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release branch ${branch_ref} points to ${branch_sha:-nothing}, expected ${EXPECTED_SHA}."
            exit 1
          fi

          git tag "${RELEASE_TAG}" "${EXPECTED_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

          branch_line="$(git ls-remote --heads origin "${branch_ref}")"
          branch_sha="${branch_line%%$'\t'*}"
          if [ "${branch_sha}" != "${EXPECTED_SHA}" ]; then
            git push origin ":refs/tags/${RELEASE_TAG}" || true
            echo "::error::Release branch ${branch_ref} moved to ${branch_sha:-nothing} while creating ${RELEASE_TAG}; deleted the new tag before publishing."
            exit 1
          fi

          remote_line="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          remote_sha="${remote_line%%$'\t'*}"
          if [ "${remote_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} points to ${remote_sha}, expected ${EXPECTED_SHA}."
            exit 1
          fi

  github-release:
    name: Publish GitHub release
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success' && needs.publish-apis.result == 'success' && (needs.prepare-release.outputs.should-create-tag != 'true' || needs.create-release-tag.result == 'success')
    needs:
      - prepare-release
      - release-gate
      - create-release-tag
      - publish-apis
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - name: Download packaged CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: trellis-cli-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TRELLIS_RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.prepare-release.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(needs.prepare-release.outputs.release-tag, '-') }}

  publish-crates:
    name: Publish Rust crates
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - github-release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        shell: bash
        working-directory: .
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          workspace_version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          published=()
          skipped=()

          crate_exists() {
            local crate="$1"
            local version="$2"
            curl --silent --show-error --fail "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          wait_for_crate_index() {
            local crate="$1"
            local version="$2"

            for attempt in {1..30}; do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                return 0
              fi
              printf 'Waiting for %s@%s to appear in the crates.io index (%s/30)\n' "$crate" "$version" "$attempt"
              sleep 10
            done

            echo "::error::${crate}@${version} did not appear in the crates.io index"
            return 1
          }

          record_skip() {
            local crate="$1"
            echo "Skipping ${crate}@${workspace_version} (already published)"
            skipped+=("${crate}@${workspace_version}")
            wait_for_crate_index "$crate" "$workspace_version"
          }

          record_publish() {
            local crate="$1"
            published+=("${crate}@${workspace_version}")
          }

          run_publish() {
            local crate="$1"
            shift
            local output
            local status

            time cargo publish --allow-dirty --dry-run "$@"

            set +e
            output=$(time cargo publish --allow-dirty "$@" 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              record_publish "$crate"
              wait_for_crate_index "$crate" "$workspace_version"
              return 0
            fi

            if printf '%s\n' "$output" | grep -Fq "already exists on crates.io index"; then
              record_skip "$crate"
              return 0
            fi

            return "$status"
          }

          publish_workspace_crate() {
            local crate="$1"

            if crate_exists "$crate" "$workspace_version"; then
              record_skip "$crate"
              return 0
            fi

            run_publish "$crate" -p "$crate"
          }

          publish_workspace_crate trellis-protocol
          # run_publish waits for protocol to enter the index before this contracts dry-run.
          publish_workspace_crate trellis-rs

          echo "Published ${#published[@]} crate(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} crate(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-apis:
    name: Publish canonical APIs
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success'
    needs:
      - prepare-release
      - release-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APIs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/trellis-cache"
          export TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache"
          cargo build --manifest-path Cargo.toml --locked --package trellis-cli
          trellis="$GITHUB_WORKSPACE/target/debug/trellis"
          for project in \
            crates/events-runtime \
            crates/jobs-runtime \
            crates/runtime \
            ts/packages/trellis
          do
            (cd "$project" && "$trellis" publish)
          done

  publish-npm:
    name: Publish npm packages
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success' && needs.package-js.result == 'success'
    needs:
      - prepare-release
      - github-release
      - package-js
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          npm_tag=latest
          published=()
          skipped=()

          package_already_exists() {
            local package_name="$1"
            local package_version="$2"
            npm view "${package_name}@${package_version}" version >/dev/null 2>&1
          }

          publish_or_skip() {
            local pkg="$1"
            local name="$2"
            local version="$3"
            local output
            local status

            if package_already_exists "$name" "$version"; then
              echo "Skipping $name@$version (already published)"
              skipped+=("$name@$version")
              return 0
            fi

            set +e
            output=$(npm publish --access public --tag "$npm_tag" "$pkg" 2>&1)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              published+=("$name@$version")
              return 0
            fi

            if printf '%s\n' "$output" | grep -Eqi 'cannot publish over|previously published version|cannot modify pre-existing version|you cannot publish over'; then
              echo "Skipping $name@$version (already published)"
              skipped+=("$name@$version")
              return 0
            fi

            return "$status"
          }

          if [[ "${RELEASE_TAG}" == *-* ]]; then
            npm_tag=rc
          fi

          packages=(
            ts/packages/result/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm
          )
          for pkg in "${packages[@]}"; do
            package_json="$pkg/package.json"
            name=$(node -p "require('./${package_json}').name")
            version=$(node -p "require('./${package_json}').version")
            publish_or_skip "$pkg" "$name" "$version"
          done

          echo "Published ${#published[@]} package(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} package(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-jsr:
    name: Publish JSR packages
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.github-release.result == 'success' && needs.package-js.result == 'success'
    needs:
      - prepare-release
      - github-release
      - package-js
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prepared release workspace
        uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: .

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ts/node_modules
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('ts/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Publish JSR packages
        shell: bash
        run: |
          set -euo pipefail
          published=()
          skipped=()

          package_field() {
            local manifest="$1"
            local field="$2"
            deno eval 'const manifest = JSON.parse(await Deno.readTextFile(Deno.args[0])); console.log(manifest[Deno.args[1]]);' "$manifest" "$field"
          }

          jsr_package_exists() {
            local package_name="$1"
            local package_version="$2"
            curl -fsL -o /dev/null "https://jsr.io/${package_name}/${package_version}_meta.json"
          }

          wait_for_jsr_package() {
            local package_name="$1"
            local package_version="$2"

            for attempt in {1..30}; do
              if jsr_package_exists "$package_name" "$package_version"; then
                return 0
              fi
              printf 'Waiting for %s@%s to appear on JSR (%s/30)\n' "$package_name" "$package_version" "$attempt"
              sleep 10
            done

            echo "::error::${package_name}@${package_version} did not appear on JSR"
            return 1
          }

          publish_or_skip() {
            local package_dir="$1"
            local manifest="${package_dir}/deno.json"
            local package_name
            local package_version
            package_name="$(package_field "$manifest" name)"
            package_version="$(package_field "$manifest" version)"

            if jsr_package_exists "$package_name" "$package_version"; then
              echo "Skipping ${package_name}@${package_version} (already published)"
              skipped+=("${package_name}@${package_version}")
              wait_for_jsr_package "$package_name" "$package_version"
              return 0
            fi

            (cd "$package_dir" && time deno publish --allow-slow-types --allow-dirty)
            published+=("${package_name}@${package_version}")
            wait_for_jsr_package "$package_name" "$package_version"
          }

          publish_or_skip ts/packages/result
          publish_or_skip ts/packages/trellis
          publish_or_skip ts/packages/trellis-test

          TRELLIS_SVELTE_JSR_RUNTIME_DEPENDENCY_VERSION="${RELEASE_VERSION}" \
            deno task -c ts/packages/trellis-svelte/deno.json build:npm
          publish_or_skip ts/packages/trellis-svelte/jsr

          echo "Published ${#published[@]} JSR package(s)"
          for item in "${published[@]}"; do
            echo "  published: $item"
          done

          echo "Skipped ${#skipped[@]} JSR package(s)"
          for item in "${skipped[@]}"; do
            echo "  skipped: $item"
          done

  publish-images:
    name: Publish ${{ matrix.image }} image
    if: always() && needs.prepare-release.outputs.should-publish == 'true' && needs.release-gate.result == 'success' && needs.github-release.result == 'success'
    needs:
      - prepare-release
      - release-gate
      - github-release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis
          - image: console

    steps:
      - name: Download verified image archive
        uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp

      - name: Normalize image owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          echo "value=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up image promotion
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=sha,prefix=sha-
            type=raw,value=rc,enable=${{ env.RELEASE_TAG != '' && contains(env.RELEASE_TAG, '-') }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !contains(env.RELEASE_TAG, '-') }}

      - name: Promote verified image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/skopeo-auth.json"
          printf '%s' "${REGISTRY_PASSWORD}" | skopeo login --authfile "${auth_file}" --username "${REGISTRY_USER}" --password-stdin "${REGISTRY}"
          while IFS= read -r image_tag; do
            [ -n "${image_tag}" ] || continue
            skopeo copy --all --dest-authfile "${auth_file}" "oci-archive:/tmp/${{ matrix.image }}.tar" "docker://${image_tag}"
          done <<< "${IMAGE_TAGS}"
