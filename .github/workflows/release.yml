name: Pipeline

# One workflow builds, verifies and, on a `release/v*` push, publishes. The file
# keeps the name release.yml because crates.io and npm trusted publishing name
# it; renaming it requires updating those publisher settings first.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A release run is never cancelled midway through publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  REGISTRY: ghcr.io
  # CI debug/test artifacts retain file-and-line backtraces, not full DWARF.
  # Production release optimization and debug assertions remain unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  # Formatting needs no generated artifacts, so it never holds back a build.
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install formatter
        run: npm ci --ignore-scripts

      # The same command local `npm test` runs; every check reports even when
      # another fails.
      - name: Check formatting
        run: bash scripts/check.sh lint

  # A pull request that touches only prose skips the build and test graph; the
  # acceptance gate still reports. Pushes and manual runs always verify fully.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!design/**'
              - '!docs/src/**'
              - '!docs/static/**'
              - '!*.md'

  install:
    name: Install generated artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reset isolated installation state
        run: rm -rf target

      - name: Cache installation build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-install-dev-locked-ci-linetables-v1-

      - name: Install generated artifacts
        run: rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install --skip-protocol-wasm

      - name: Report installation cache input size
        if: always()
        run: du -sh target 2>/dev/null || true

      - name: Upload installed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-generated
          path: |
            crates/trellis/generated
            crates/models/generated
            crates/trellis-testkit/generated
            crates/runtime-apis/generated
            web/trellis
            ts/packages/trellis-testkit/trellis
            integration/fixtures/runtime/packages/runtime-trellis
            integration/fixtures/runtime/v2/packages/runtime-trellis
            integration/fixtures/runtime-pinned/packages/runtime-trellis
            integration/fixtures/runtime-removed/packages/runtime-trellis
            integration/fixtures/client-upgrade/packages/client-upgrade
            integration/fixtures/client-upgrade-narrow/packages/client-upgrade
            integration/fixtures/client-upgrade-consent/packages/client-upgrade
            integration/fixtures/client-upgrade-breaking/packages/client-upgrade
            integration/fixtures/testkit/crates/trellis-test-fixture
            integration/fixtures/testkit/packages/trellis-test-fixture
            benchmarks/runtime/crates/performance-trellis
            benchmarks/runtime/packages/performance-trellis
            ts/packages/trellis/internal_sdk/generated
            demos/rust/service/trellis
            demos/rust/device/trellis
            demos/ts/service/trellis
            demos/ts/device/trellis
            demos/app/trellis
            docs/examples/orders/trellis
          include-hidden-files: true
          retention-days: 1

  wasm:
    name: Protocol WASM
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build protocol WASM
        run: cargo run --manifest-path xtask/Cargo.toml -- protocol-wasm

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

  portal:
    name: Embedded browser apps
    needs: [install, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          node: true

      - name: Install Node workspace dependencies
        run: npm ci

      # Consume the already-generated API artifacts and protocol WASM; do not
      # re-run the developer wrapper that recompiles xtask and the WASM.
      - name: Build embedded browser apps
        run: npm run browser:embedded

      - name: Upload embedded browser apps
        uses: actions/upload-artifact@v4
        with:
          name: check-portal
          path: crates/runtime/generated
          retention-days: 1

  clippy:
    name: Rust lint
    needs: [install, portal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          portal: true

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust lint artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-clippy-ci-linetables-v1-

      # Each verification command lives in scripts/check.sh, which local
      # `npm test` runs too.
      - name: Lint Rust
        run: bash scripts/check.sh clippy

  build-fixtures:
    name: Build integration fixture binaries
    needs: [install, portal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          portal: true

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache fixture build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'integration/fixtures/**/Cargo.toml', 'integration/fixtures/**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-fixture-binaries-ci-linetables-v1-

      # Cross-language helper/provider executables for the TypeScript integration
      # tests, the testkit live test binary and the health_watch example. Built
      # once here so the tests do not compile Rust while they run.
      - name: Build integration fixture helpers
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo build --bins \
            --manifest-path integration/fixtures/runtime/Cargo.toml \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\""
          cargo build --manifest-path Cargo.toml -p trellis-runtime --example health_watch

      - name: Build the testkit live test binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo test --no-run \
            --manifest-path integration/fixtures/testkit/Cargo.toml \
            --config "patch.crates-io.trellis-protocol.path=\"$GITHUB_WORKSPACE/crates/protocol\"" \
            --config "patch.crates-io.trellis-models.path=\"$GITHUB_WORKSPACE/crates/models\"" \
            --config "patch.crates-io.trellis-rs.path=\"$GITHUB_WORKSPACE/crates/trellis\"" \
            --config "patch.crates-io.trellis-testkit.path=\"$GITHUB_WORKSPACE/crates/trellis-testkit\"" \
            --test live \
            --message-format=json > "$RUNNER_TEMP/testkit-live.json"
          executable="$(jq -r 'select(.executable != null) | .executable' "$RUNNER_TEMP/testkit-live.json" | tail -n1)"
          if [ -z "${executable}" ] || [ "${executable}" = "null" ]; then
            echo "failed to locate the testkit live test binary" >&2
            exit 1
          fi
          cp "${executable}" target/debug/trellis-testkit-live

      # Multithreaded zstd instead of the upload's single-threaded compression;
      # the tar preserves executable modes.
      - name: Stage fixture binaries
        run: |
          set -euo pipefail
          umask 077
          staging="$RUNNER_TEMP/fixture-binaries"
          rm -rf "$staging"
          mkdir -p "$staging/fixtures" "$staging/examples"
          cp target/debug/trellis-testkit-live "$staging/"
          for bin in trellis-runtime-acceptance caller resources events live_probe live_probe_caller live_application_versions empty_watch finite_rpc rpc_distribution operation_target operation_storage_upload operation_lease_loss device_companion transport_growth_subject transport_growth_operation transfer_generation stream_transfer jobs; do
            cp "target/debug/${bin}" "$staging/fixtures/"
          done
          cp target/debug/examples/health_watch "$staging/examples/"
          find "$staging" -type f -exec strip --strip-unneeded {} +
          tar -C "$staging" -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/fixture-binaries.tar.zst"

      - name: Upload fixture binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-fixture-binaries
          path: ${{ runner.temp }}/fixture-binaries.tar.zst
          compression-level: 0
          retention-days: 1

  build:
    name: Build runtime binaries
    needs: [install, wasm, portal]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      # The one release build every live, browser, demo, package, and image job
      # runs, compiled against the runtime image's Debian bookworm glibc. See
      # crates/runtime/Containerfile.build for why it is a container build.
      - name: Build release binaries
        run: |
          set -euo pipefail
          docker buildx build --builder default --pull \
            --file crates/runtime/Containerfile.build \
            --output "type=local,dest=$RUNNER_TEMP/release" \
            .

      - name: Stage runtime binaries and CLI archives
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/runtime-binaries"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$RUNNER_TEMP/release/trellis" "$RUNNER_TEMP/release/trellis-server" "$staging/"
          bash scripts/acquire-test-nats.sh --dest "$staging/nats"
          tar -C "$staging" -czf "$RUNNER_TEMP/runtime-binaries.tar.gz" .
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          target="x86_64-unknown-linux-gnu"
          archive="trellis-${version}-${target}.tar.gz"
          mkdir -p dist
          tar -C "$RUNNER_TEMP/release" -czf "dist/$archive" trellis trellis-server
          sha256sum "dist/$archive" > "dist/checksum-${version}-${target}-trellis.sha256"

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries.tar.gz
          retention-days: 1

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3

  rust:
    name: Rust
    needs: [install, wasm, portal, build, build-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_CACHE_DIR: ${{ github.workspace }}/target/trellis-nats-cache
      TRELLIS_TEST_NATS_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_NATS_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/nats/nats-server
      TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis
      TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis-server
      TRELLIS_TEST_EVENTS_BIN: ${{ github.workspace }}/dist/runtime-binaries/fixtures/events
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true
          node: true

      - name: Download runtime and fixture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: check-*-binaries
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Extract runtime and fixture binaries
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-binaries
          tar -xzf "$RUNNER_TEMP/binaries/runtime-binaries.tar.gz" -C dist/runtime-binaries
          tar --zstd -xf "$RUNNER_TEMP/binaries/fixture-binaries.tar.zst" -C dist/runtime-binaries

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml') }}-
            cargo-${{ steps.rust.outputs.cachekey }}-${{ runner.os }}-${{ runner.arch }}-workspace-all-targets-ci-linetables-v1-

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Install Chromium for Rust-owned browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Provide NSS certutil for generated-CA browser trust
        run: sudo apt-get install --yes --no-install-recommends libnss3-tools

      # Nextest runs every test binary in parallel instead of one binary at a
      # time; it does not run documentation examples, so those run separately.
      - name: Test Rust workspace
        run: bash scripts/check.sh rust

  typescript:
    name: TypeScript
    needs: [install, wasm, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          node: true

      - name: Download producer-built adapter-test runtime
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: dist

      - name: Extract producer-built adapter-test runtime
        run: mkdir -p dist/runtime-binaries && tar -xzf dist/runtime-binaries.tar.gz -C dist/runtime-binaries ./trellis ./trellis-server

      - name: Install Node workspace dependencies
        run: npm ci

      # Each check reports even when another fails.
      - name: Check and test TypeScript
        env:
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/runtime-binaries/trellis-server
        run: bash scripts/check.sh typescript

  demos:
    name: Demo consumers
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true
          node: true

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Expose repository CLI
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: npm ci

      - name: Check demos and the TypeScript publication
        run: bash scripts/check.sh demos

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            ts/packages/result/npm
            ts/packages/trellis-testkit/npm
            ts/packages/trellis/npm
            ts/packages/trellis-svelte/npm
          retention-days: 3

  live-rust:
    name: Rust live integration
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Run Rust live integration
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
        run: bash scripts/check.sh live-rust

  live-typescript:
    name: TypeScript live integration (${{ matrix.shard }}/8)
    needs: [install, wasm, portal, build, build-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run independent test files on separate hosted runners; every shard must pass.
    # Failures in one shard must not cancel another shard's functional evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true
          node: true

      - name: Download runtime and fixture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: check-*-binaries
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Stage runtime and fixture binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/binaries/runtime-binaries.tar.gz" -C target/debug
          tar --zstd -xf "$RUNNER_TEMP/binaries/fixture-binaries.tar.zst" -C target/debug

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Run TypeScript live integration
        env:
          TRELLIS_TEST_SHARD: ${{ matrix.shard }}/8
          # Two active file workers per hosted runner. The suite mostly waits on
          # real authorization expiry, so more hosts shorten the slowest shard.
          TRELLIS_TEST_CONCURRENCY: "2"
        run: bash scripts/check.sh live-typescript

  examples:
    name: Documented examples
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          node: true

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Verify documented Orders service
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
        run: |
          npm ci
          bash scripts/check.sh examples

  browser:
    name: Browser (${{ matrix.shard }}/8)
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every browser test file, split across hosted runners; every shard must
    # pass, and one shard's failure must not cancel another's evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true
          node: true

      - name: Download runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: check-runtime-binaries
          path: ${{ runner.temp }}/runtime-binaries

      - name: Stage runtime binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xzf "$RUNNER_TEMP/runtime-binaries/runtime-binaries.tar.gz" -C target/debug

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Install pinned Chromium and browser dependencies
        working-directory: ts
        run: npm exec --yes --package=playwright@1.59.1 -- playwright install --with-deps chromium

      - name: Provide NSS certutil for generated-CA browser trust
        run: sudo apt-get install --yes --no-install-recommends libnss3-tools

      - name: Run browser tests
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/target/debug/trellis-server
          TRELLIS_TEST_CLI_BIN: ${{ github.workspace }}/target/debug/trellis
          TRELLIS_TEST_SHARD: ${{ matrix.shard }}/8
          TRELLIS_BROWSER_CONCURRENCY: "2"
        run: bash scripts/check.sh browser

      - name: Upload sanitized failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.shard }}
          path: |
            ts/browser/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  rust-testkit-package:
    name: Rust testkit bundle
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Download production native archives
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: dist/native

      # Packages the public crates and stages the artifact-only bundle that
      # the next job verifies without a checkout.
      - name: Package the public crates and the verification bundle
        run: bash scripts/check.sh rust-testkit "$RUNNER_TEMP/rust-testkit-bundle.tar.gz"

      - name: Upload public Rust packages
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-packages
          path: target/package/*.crate
          retention-days: 3

      - name: Upload the verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-testkit-bundle
          path: ${{ runner.temp }}/rust-testkit-bundle.tar.gz
          retention-days: 3

  rust-testkit-consumer:
    name: Rust testkit artifact-only consumer
    needs: [rust-testkit-package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the verification bundle
        uses: actions/download-artifact@v4
        with:
          name: rust-testkit-bundle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract the verification bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf rust-testkit-bundle.tar.gz -C bundle --no-same-owner

      - name: Verify the packaged testkit without a checkout
        run: bash bundle/verify-rust-test-package.sh --bundle "$PWD/bundle"

  verify-images:
    name: Build verified ${{ matrix.image }} image
    needs: [install, wasm, portal, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trellis-server
            file: crates/runtime/Containerfile.release
            title: trellis-server
            description: Trellis Rust runtime
          - image: console
            file: web/Containerfile
            title: console
            description: Trellis administrative web console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          portal: true

      - name: Download native Linux runtime archives
        if: matrix.image == 'trellis-server'
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/native-runtime

      - name: Stage native binaries for image assembly
        if: matrix.image == 'trellis-server'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/native-runtime" -maxdepth 1 -name 'trellis-*-x86_64-unknown-linux-gnu.tar.gz' | head -n1)"
          if [ -z "${archive}" ]; then
            echo "missing native Linux runtime archive for x86_64-unknown-linux-gnu" >&2
            exit 1
          fi
          mkdir -p dist/native/amd64
          tar --no-same-owner -xzf "${archive}" -C dist/native/amd64 trellis trellis-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verified image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/${{ matrix.image }}.tar
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build native trellis image for the managed-mode smoke
        if: matrix.image == 'trellis-server'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/runtime/Containerfile.release
          platforms: linux/amd64
          load: true
          tags: trellis-smoke:test
          build-args: |
            TRELLIS_VERSION=${{ github.ref_name }}
            TRELLIS_REVISION=${{ github.sha }}

      - name: Smoke-test managed NATS in the trellis image
        if: matrix.image == 'trellis-server'
        shell: bash
        run: bash scripts/check.sh images --smoke-only

      - name: Upload verified image archive
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          compression-level: 0
          retention-days: 3

  typescript-testkit-package:
    name: TypeScript testkit package
    needs: [install, wasm, demos, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pipeline inputs
        uses: ./.github/actions/check-inputs
        with:
          generated: true
          protocol-wasm: true
          node: true

      - name: Download the CLI archive
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: dist/native

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Download the npm packages the demos verified
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ts/packages

      - name: Test the packed testkit in a fresh project
        run: bash scripts/check.sh typescript-testkit

  acceptance:
    name: Acceptance gate
    needs:
      - changes
      - lint
      - clippy
      - rust
      - typescript
      - demos
      - examples
      - browser
      - live-rust
      - live-typescript
      - rust-testkit-consumer
      - typescript-testkit-package
      - verify-images
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          # A prose-only pull request skips verification; nothing may fail.
          failed="$(jq -c --arg code "$CODE_CHANGED" '
            (if $code == "true" or .changes.result != "success"
              then ["success"] else ["success", "skipped"] end) as $allowed
            | with_entries(select(.value.result as $result | $allowed | index($result) | not))
            | map_values(.result)' <<<"$NEEDS")"
          if [[ "$failed" != "{}" ]]; then
            echo "verification did not all succeed: $failed" >&2
            exit 1
          fi
          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "only documentation changed; build and test verification skipped"
          else
            echo "all $(jq length <<<"$NEEDS") verification jobs succeeded"
          fi

  # Publication runs only for a `release/vX.Y.Z[-rc.N]` push, after every
  # verification job, from this run's artifacts; it never rebuilds the product
  # or verifies again, so a version that passed the gate publishes in full.
  # A failed publish step is retried with "Re-run failed jobs": each step skips
  # what is already published and never overwrites published bytes.
  release-metadata:
    name: Release metadata
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release branch '$GITHUB_REF_NAME'; expected release/vX.Y.Z or release/vX.Y.Z-rc.N"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists; choose a new version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release metadata and write the notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cargo xtask release check-metadata --version "${RELEASE_TAG#v}"
          cargo xtask release write-notes --tag "$RELEASE_TAG" --output dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  publish-apis:
    name: Publish canonical APIs
    needs: [acceptance, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the CLI archive
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/cli

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The canonical APIs live in one native package (`crates/builtin-contracts`,
      # package `trellis`); the other crates and TypeScript packages are
      # generated consumers and carry no publishable `trellis.toml`.
      - name: Publish APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cli/"trellis-*.tar.gz -C "$RUNNER_TEMP/bin" trellis
          cd crates/builtin-contracts
          "$RUNNER_TEMP/bin/trellis" publish

  create-release-tag:
    name: Create release tag
    needs: [release-metadata, publish-apis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tag the verified commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          branch="$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$branch" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved to ${branch:-nothing}; this run verified $GITHUB_SHA."
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ -z "$existing" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$RELEASE_TAG points to $existing, not $GITHUB_SHA."
            exit 1
          fi

  github-release:
    name: Publish GitHub release
    needs: [release-metadata, create-release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the CLI archive
        uses: actions/download-artifact@v4
        with:
          name: trellis-cli-x86_64-unknown-linux-gnu
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Upload missing assets and verify existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md "${flags[@]}"
          fi
          release="$(gh release view "$RELEASE_TAG" --json assets)"
          existing="$(mktemp -d "$RUNNER_TEMP/existing-release.XXXXXX")"
          missing=()
          for asset in dist/trellis-*.tar.gz dist/checksum-*.sha256; do
            name="$(basename "$asset")"
            if jq -e --arg name "$name" '.assets | any(.name == $name)' <<<"$release" >/dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp "$asset" "$existing/$name"
            else
              missing+=("$asset")
            fi
          done
          # Never overwrite published bytes, including after a partial upload.
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false

  publish-crates:
    name: Publish Rust crates
    needs: [release-metadata, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore generated inputs
        uses: actions/download-artifact@v4
        with:
          name: check-generated

      - name: Download the verified Rust packages
        uses: actions/download-artifact@v4
        with:
          name: rust-testkit-packages
          path: dist/rust-packages

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          crate_versions="$(cargo metadata --format-version 1 --no-deps --locked)"

          wait_for_index() {
            for attempt in {1..30}; do
              if cargo info "$1@$2" >/dev/null 2>&1; then return 0; fi
              printf 'Waiting for %s@%s in the crates.io index (%s/30)\n' "$1" "$2" "$attempt"
              sleep 10
            done
            echo "::error::$1@$2 did not appear in the crates.io index"
            return 1
          }

          # Each dependency reaches the index before its consumer publishes.
          for crate in trellis-protocol trellis-models trellis-rs trellis-testkit; do
            version="$(jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<<"$crate_versions")"
            if curl --silent --fail "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "Skipping $crate@$version (already published)"
            else
              bash scripts/prepare-rust-publication.sh dist/rust-packages target "$crate"
              cargo publish --allow-dirty --locked --config .cargo/publication.toml -p "$crate"
            fi
            wait_for_index "$crate" "$version"
          done

  publish-npm:
    name: Publish npm packages
    needs: [release-metadata, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The packages the demos job verified, with 'ts/packages' as the
      # artifact root.
      - name: Download the verified npm packages
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ts/packages

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          npm_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then npm_tag=rc; fi
          publish() {
            local name version
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              return 0
            fi
            npm publish --access public --tag "$npm_tag" "./$1"
          }
          packages=(ts/packages/result/npm ts/packages/trellis/npm ts/packages/trellis-svelte/npm ts/packages/trellis-testkit/npm)
          # npm compares the repository with GitHub provenance case-sensitively.
          for pkg in "${packages[@]}"; do
            npm pkg set "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" --prefix "$pkg"
          done
          for pkg in "${packages[@]}"; do publish "$pkg"; done

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: [release-metadata, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        image: [trellis-server, console]
    steps:
      - name: Download the verified image archive
        uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: ${{ runner.temp }}/image

      - name: Promote the verified image
        shell: bash
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=rc; fi
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install --yes skopeo; }
          auth="$RUNNER_TEMP/skopeo-auth.json"
          printf '%s' "$REGISTRY_PASSWORD" |
            skopeo login --authfile "$auth" --username "$REGISTRY_USER" --password-stdin "$REGISTRY"
          for tag in "$RELEASE_TAG" "sha-${GITHUB_SHA:0:7}" "$channel"; do
            skopeo copy --all --dest-authfile "$auth" \
              "oci-archive:$RUNNER_TEMP/image/$IMAGE.tar" "docker://$REGISTRY/$owner/$IMAGE:$tag"
          done
