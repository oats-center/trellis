name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Build released and current docs
        shell: bash
        run: |
          set -euo pipefail

          site_root="/${GITHUB_REPOSITORY#*/}"
          pages_root="${RUNNER_TEMP}/pages"
          release_root="${GITHUB_WORKSPACE}"
          # The released docs follow the newest stable tag, or the newest
          # prerelease until a stable release exists.
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | grep -v -- - | head -n 1 || true)"
          if [ -z "${latest_tag}" ]; then
            latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          fi

          # Tags before 23cd10af fail to build (no mermaid grammar) and link to
          # API docs the site no longer generates.
          if [ -n "${latest_tag}" ] && git merge-base --is-ancestor 23cd10af "${latest_tag}"; then
            release_root="${RUNNER_TEMP}/release"
            git worktree add --detach "${release_root}" "${latest_tag}"
          else
            echo "Latest release tag predates the current docs build; using main until the next release"
          fi

          build_docs() {
            (
              cd "$1"
              npm ci --workspace @trellis/docs --include-workspace-root --ignore-scripts --no-audit --no-fund
              cd docs
              npm run docs:design
              SITE_BASE_PATH="$2" npm exec -- vite build
              mkdir -p "$3"
              cp -R build/. "$3/"
            )
          }

          build_docs "${release_root}" "${site_root}" "${pages_root}"
          build_docs "${GITHUB_WORKSPACE}" "${site_root}/current" "${pages_root}/current"

          cat > "${pages_root}/404.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Trellis</title>
              <script>window.location.replace(window.location.origin + ${site_root@Q} + "/");</script>
            </head>
            <body></body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
