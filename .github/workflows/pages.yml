name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: ~/.cache/trellis/pages-generator
          key: pages-generator-${{ runner.os }}-${{ hashFiles('ts/packages/trellis/deno.json') }}
          restore-keys: |
            pages-generator-${{ runner.os }}-

      - name: Build released and current site artifacts
        shell: bash
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          site_root="/${repo_name}"
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

          if [ -z "${latest_tag}" ]; then
            echo "No release tag found; using current HEAD for release site"
            latest_tag="HEAD"
          fi

          release_root="/tmp/trellis-release-site"
          current_root="${GITHUB_WORKSPACE}"
          pages_root="/tmp/trellis-pages-site"
          release_worktree_path="/tmp/trellis-release-worktree"
          release_worktree="${release_worktree_path}"
          release_worktree_created="false"

          rm -rf "${release_root}" "${pages_root}" "${release_worktree_path}"
          mkdir -p "${release_root}" "${pages_root}"

          if [ "${latest_tag}" = "HEAD" ]; then
            release_worktree="${current_root}"
          else
            git worktree add --detach "${release_worktree_path}" "${latest_tag}"
            release_worktree_created="true"
          fi

          cleanup() {
            if [ "${release_worktree_created}" = "true" ]; then
              git worktree remove --force "${release_worktree_path}"
            fi
          }
          trap cleanup EXIT

          install_apis() {
            local repo_root="$1"
            (cd "${repo_root}" && rm -rf "$RUNNER_TEMP/trellis-cache" && TRELLIS_CACHE="$RUNNER_TEMP/trellis-cache" cargo xtask install)
          }

          build_docs() {
            local repo_root="$1"
            local base_path="$2"
            local out_dir="$3"

            (
              cd "${repo_root}/docs"
              deno install --allow-scripts=npm:esbuild,npm:sharp
              deno run -A ./scripts/generate_ts_api_docs.ts
              SITE_BASE_PATH="${base_path}" deno run -A vite build
              mkdir -p "${out_dir}"
              cp -R build/. "${out_dir}/"
            )
          }

          build_console() {
            local repo_root="$1"
            local base_path="$2"
            local out_dir="$3"

            (
              cd "${repo_root}/web"
              SITE_BASE_PATH="${base_path}" deno run -A vite build
              mkdir -p "${out_dir}/assets/web" "${out_dir}/console"
              cp -R build/assets/web/. "${out_dir}/assets/web/"
              cp build/200.html "${out_dir}/console/index.html"
            )
          }

          release_docs_root="${release_worktree}"
          if [ ! -d "${release_docs_root}/docs" ]; then
            echo "Latest release tag worktree is missing docs; using current main docs until the next release tag"
            release_docs_root="${current_root}"
          fi

          release_console_root="${release_worktree}"
          if [ ! -f "${release_worktree}/web/svelte.config.js" ]; then
            echo "Latest release tag worktree is missing console sources; using current main console until the next release tag"
            release_console_root="${current_root}"
          elif ! grep -q 'SITE_BASE_PATH' "${release_worktree}/web/svelte.config.js"; then
            echo "Latest release tag predates Pages console base-path support; using current main console until the next release tag"
            release_console_root="${current_root}"
          fi

          if [ ! -f "${release_worktree}/ts/packages/trellis/trellis.toml" ]; then
            echo "Latest release tag predates project-local API installation; using current main until the next release tag"
            release_docs_root="${current_root}"
            release_console_root="${current_root}"
          fi

          install_apis "${release_docs_root}"
          if [ "${release_console_root}" != "${release_docs_root}" ]; then
            install_apis "${release_console_root}"
          fi
          if [ "${current_root}" != "${release_docs_root}" ] && [ "${current_root}" != "${release_console_root}" ]; then
            install_apis "${current_root}"
          fi

          ensure_protocol_wasm() {
            local repo_root="$1"
            local output="${repo_root}/ts/packages/trellis/auth/protocol_wasm/trellis_protocol_wasm.js"
            if [ -s "${output}" ]; then
              return 0
            fi
            cargo run --manifest-path "${repo_root}/rust/xtask/Cargo.toml" -- protocol-wasm
          }

          ensure_protocol_wasm "${release_docs_root}"
          ensure_protocol_wasm "${release_console_root}"
          ensure_protocol_wasm "${current_root}"

          build_docs "${release_docs_root}" "${site_root}" "${release_root}/docs"
          build_docs "${current_root}" "${site_root}/current" "${pages_root}/current"

          build_console "${release_console_root}" "${site_root}" "${release_root}/console"
          build_console "${current_root}" "${site_root}/current" "${pages_root}/current"

          cp -R "${release_root}/docs/." "${pages_root}/"
          mkdir -p "${pages_root}/assets/web" "${pages_root}/console"
          cp -R "${release_root}/console/assets/web/." "${pages_root}/assets/web/"
          cp "${release_root}/console/console/index.html" "${pages_root}/console/index.html"

          cat > "${pages_root}/404.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Trellis site redirect</title>
              <script>
                (() => {
                  const siteRoot = ${site_root@Q};
                  const pathname = window.location.pathname;
                  const search = window.location.search;
                  const hash = window.location.hash;
                  const prefixes = ["/current/console", "/console"];

                  for (const prefix of prefixes) {
                    const fullPrefix = siteRoot + prefix;
                    if (pathname === fullPrefix || pathname.startsWith(fullPrefix + "/")) {
                      const route = pathname.slice(fullPrefix.length).replace(/^\//, "");
                      const target = new URL(fullPrefix + "/", window.location.origin);
                      if (route || search || hash) {
                        target.searchParams.set("__trellis_route", route + search + hash);
                      }
                      window.location.replace(target.toString());
                      return;
                    }
                  }

                  window.location.replace(window.location.origin + siteRoot + "/");
                })();
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/trellis-pages-site

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
