# Apply these deployment settings to a fresh `trellis init config` bundle.
# Retain that bundle's unique auth.instance_id and all generated private files.
# This template intentionally does not provide a reusable installation identity.
instance_name = "Trellis"
event_session_seed_file = "./session.seed"

[paths]
data = "/var/lib/trellis"
state = "/var/lib/trellis"
runtime = "/run/trellis"
logs = "/var/lib/trellis/log"

[live_provider_seed_files]
platform = "./live-providers/platform.seed"
health = "./live-providers/health.seed"
jobs = "./live-providers/jobs.seed"
events = "./live-providers/events.seed"

# Present when `trellis init config` generated the installation CA; the
# runtime and Console then warn with its fingerprint. Omit with supplied TLS.
[tls]
generated_ca_certificate = "./tls/ca.crt"

[http]
bind_address = "0.0.0.0"
port = 3000
public_origin = "https://console.example.com"
origins = ["https://console.example.com"]

# Console is served as plaintext only to the external HTTPS proxy, which reaches
# it through the published loopback port and the trellis.network subnet. Peers
# outside it are refused and logged with their address. Use mode = "tls" with
# the bundle certificate to terminate TLS here instead.
[http.transport]
mode = "proxy"
trusted_proxies = ["10.89.70.0/24"]

[nats]
servers = "tls://nats.example.com:4222"
# The broker certificate chains to the installation CA.
ca_certificate = "./tls/ca.crt"

[nats.runtime]
auth_creds_path = "./nats/creds/auth-auth.creds"
trellis_creds_path = "./nats/creds/trellis-auth.creds"
system_creds_path = "./nats/creds/system.creds"

[nats.auth_callout]
issuer_signing_seed_file = "./nats/secrets/auth-issuer-signing.seed"
target_signing_seed_file = "./nats/secrets/auth-target-signing.seed"
xkey_seed_file = "./nats/secrets/auth-sx.seed"
sentinel_public_key_file = "./nats/secrets/auth-sentinel.pub"

[auth]
instance_id = "RETAIN_YOUR_GENERATED_AUTH_INSTANCE_ID"
oauth_storage_key_file = "./auth/oauth-storage.key"

[auth.oauth]
origin = "https://auth.example.com"
bind_address = "0.0.0.0"
port = 3001
# Behind a reverse proxy, list its addresses so request admission budgets each
# forwarded client rather than the proxy. Forwarding headers are otherwise ignored.
# trusted_proxies = ["10.0.0.5/32"]

[auth.oauth.transport]
mode = "tls"
certificate_chain = "./tls/runtime.crt"
private_key = "./tls/runtime.key"

[auth.authorization]
issuer_signing_seed_file = "./auth/authorization-issuer.seed"
context_lifetime_seconds = 300
allowed_clock_skew_seconds = 30

[client]
nats_servers = ["tls://nats.example.com:4222"]
ws_nats_servers = ["wss://nats.example.com"]

[leases]
bucket = "trellis_runtime_leases"
replicas = 1
ttl_ms = 30000
renew_ms = 5000

[auth.local_identity]
enabled = true
password_min_length = 12

[platform.storage]
kind = "sqlite"
path = "/var/lib/trellis/platform.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[health.storage]
kind = "sqlite"
path = "/var/lib/trellis/health.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[jobs.storage]
kind = "sqlite"
path = "/var/lib/trellis/jobs.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[events.storage]
kind = "sqlite"
path = "/var/lib/trellis/events.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true
