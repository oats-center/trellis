# Apply these deployment settings to a fresh `trellis-server init <folder>`
# installation. Keep that installation's unique auth.instance_id and its
# secrets.toml. This template intentionally does not provide a reusable
# installation identity.
instance_name = "Trellis"

# The container's root filesystem is read-only, so logs go to the data volume.
# Data and runtime files already default to /var/lib/trellis and /run/trellis
# with --system.
[paths]
logs = "/var/lib/trellis/log"

# Present when `trellis-server init` generated the installation CA; the
# runtime warns with its fingerprint. Omit with supplied TLS.
[tls]
generated_ca_certificate = "./tls/ca.crt"

# The Trellis listener: sign-in, discovery and health, where clients connect.
[http]
bind_address = "0.0.0.0"
port = 3000
public_origin = "https://trellis.example.com"

# Trellis, with the Console at /console, is served as plaintext only to the
# external HTTPS proxy, which reaches it through the published loopback port
# and the trellis.network subnet. Peers outside it are refused and logged with their
# address. Use mode = "tls" with the bundle certificate to terminate TLS here
# instead.
[http.transport]
mode = "proxy"
trusted_proxies = ["10.89.70.0/24"]

# Uncomment to give the Console a hostname of its own, pointed at the same
# port, so its pages run apart from sign-in. `enabled = false` instead serves
# no Console at all.
# [console]
# origin = "https://console.example.com"

[nats]
servers = "tls://nats.example.com:4222"
# The broker certificate chains to the installation CA.
ca_certificate = "./tls/ca.crt"

[auth]
instance_id = "RETAIN_YOUR_GENERATED_AUTH_INSTANCE_ID"

[auth.authorization]
context_lifetime_seconds = 300
allowed_clock_skew_seconds = 30

[client]
nats_servers = ["tls://nats.example.com:4222"]
ws_nats_servers = ["wss://nats.example.com"]

[leases]
bucket = "trellis_runtime_leases"
replicas = 1
ttl_ms = 30000
renew_ms = 5000

[auth.local_identity]
password_min_length = 12

[platform.storage]
kind = "sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[health.storage]
kind = "sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[jobs.storage]
kind = "sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[events.storage]
kind = "sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true
