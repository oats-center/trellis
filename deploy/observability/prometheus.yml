global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
- recording-rules.yml
- expected-components.yml
- alert-rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 127.0.0.1:9093
scrape_configs:
- job_name: trellis-native
  honor_labels: true
  static_configs:
  - targets:
    - 127.0.0.1:9464
    labels:
      telemetry_pipeline: native
      trellis_cluster: example
- job_name: trellis-browser
  honor_labels: true
  static_configs:
  - targets:
    - 127.0.0.1:9465
    labels:
      telemetry_pipeline: browser
      trellis_cluster: example
- job_name: otel-collector
  static_configs:
  - targets:
    - 127.0.0.1:8888
    - 127.0.0.1:8889
    labels:
      trellis_cluster: example
- job_name: node
  static_configs:
  - targets:
    - 127.0.0.1:9100
    labels:
      trellis_cluster: example
- job_name: nats-exporter
  static_configs:
  - targets:
    - 127.0.0.1:7777
    labels:
      trellis_cluster: example
- job_name: trellis-http
  metrics_path: /probe
  params:
    module:
    - http_2xx
  static_configs:
  - targets:
    - http://127.0.0.1:3000/readyz
    labels:
      trellis_cluster: example
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: nats-health
  metrics_path: /probe
  params:
    module:
    - http_2xx
  static_configs:
  - targets:
    - http://127.0.0.1:8222/healthz
    labels:
      trellis_cluster: example
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
