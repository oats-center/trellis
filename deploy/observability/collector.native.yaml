# Isolated production reference; see deploy/observability/README.md
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/traces:
    create_directory: true
    directory: /var/lib/otelcol/trellis-traces
receivers:
  otlp/native:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource/native:
    attributes:
    - key: trellis.telemetry.origin
      value: native
      action: upsert
    - key: trellis.cluster
      value: ${env:TRELLIS_CLUSTER}
      action: upsert
    - key: deployment.environment.name
      value: ${env:TRELLIS_ENVIRONMENT}
      action: upsert
  batch/native:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  prometheus/native:
    endpoint: 127.0.0.1:9464
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    enable_open_metrics: true
    without_scope_info: true
    metric_expiration: 90s
    resource_constant_labels:
      included:
      - service.name
      - service.namespace
      - service.instance.id
      - service.version
      - trellis.cluster
      - deployment.environment.name
      - trellis.role
      - trellis.telemetry.origin
  otlp_http/traces:
    endpoint: ${env:TRELLIS_TRACE_BACKEND}
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage/traces
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 300s
service:
  extensions:
  - health_check
  - file_storage/traces
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
              without_type_suffix: true
              without_units: true
  pipelines:
    traces/native:
      receivers:
      - otlp/native
      processors:
      - memory_limiter
      - resource/native
      - batch/native
      exporters:
      - otlp_http/traces
    metrics/native:
      receivers:
      - otlp/native
      processors:
      - memory_limiter
      - resource/native
      - batch/native
      exporters:
      - prometheus/native
