groups:
- name: trellis.recordings
  interval: 30s
  rules:
  - record: trellis:rpc_requests:5m
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"ok|declared_error|timeout|unavailable|error"}[5m]))
  - record: trellis:rpc_errors:5m
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"timeout|unavailable|error"}[5m]))
      or on (trellis_cluster) (0 * trellis:rpc_requests:5m)
  - record: trellis:rpc_error_ratio:5m
    expr: trellis:rpc_errors:5m / clamp_min(trellis:rpc_requests:5m, 0.000001) and on (trellis_cluster) (trellis:rpc_requests:5m > 0)
  - record: trellis:rpc_requests:30m
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"ok|declared_error|timeout|unavailable|error"}[30m]))
  - record: trellis:rpc_errors:30m
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"timeout|unavailable|error"}[30m]))
      or on (trellis_cluster) (0 * trellis:rpc_requests:30m)
  - record: trellis:rpc_error_ratio:30m
    expr: trellis:rpc_errors:30m / clamp_min(trellis:rpc_requests:30m, 0.000001) and on (trellis_cluster) (trellis:rpc_requests:30m > 0)
  - record: trellis:rpc_requests:1h
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"ok|declared_error|timeout|unavailable|error"}[1h]))
  - record: trellis:rpc_errors:1h
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"timeout|unavailable|error"}[1h]))
      or on (trellis_cluster) (0 * trellis:rpc_requests:1h)
  - record: trellis:rpc_error_ratio:1h
    expr: trellis:rpc_errors:1h / clamp_min(trellis:rpc_requests:1h, 0.000001) and on (trellis_cluster) (trellis:rpc_requests:1h > 0)
  - record: trellis:rpc_requests:6h
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"ok|declared_error|timeout|unavailable|error"}[6h]))
  - record: trellis:rpc_errors:6h
    expr: sum by (trellis_cluster) (rate(trellis_rpc_server_duration_count{telemetry_pipeline="native",trellis_outcome=~"timeout|unavailable|error"}[6h]))
      or on (trellis_cluster) (0 * trellis:rpc_requests:6h)
  - record: trellis:rpc_error_ratio:6h
    expr: trellis:rpc_errors:6h / clamp_min(trellis:rpc_requests:6h, 0.000001) and on (trellis_cluster) (trellis:rpc_requests:6h > 0)
  - record: trellis:component_present
    expr: max by (trellis_cluster, trellis_component) ((trellis_runtime_component_ready{telemetry_pipeline="native"} == 1) and on (job, instance, trellis_cluster,
      trellis_component) ((time() - trellis_runtime_component_observed_time{telemetry_pipeline="native"}) < 45))
  - record: trellis:snapshot_fresh
    expr: max by (trellis_cluster, trellis_source) ((trellis_snapshot_observed_time{telemetry_pipeline="native"} > bool 0) * ((time() - trellis_snapshot_observed_time{telemetry_pipeline="native"}) < bool 45))
  - record: trellis:process_snapshot_fresh
    expr: max by (job, instance, trellis_cluster, trellis_source) ((trellis_snapshot_observed_time{telemetry_pipeline="native"} > bool 0) * ((time() - trellis_snapshot_observed_time{telemetry_pipeline="native"}) < bool 45))
  - record: trellis:source_owner_fresh
    expr: (label_replace(trellis:process_snapshot_fresh{trellis_source="auth"} == 1, "trellis_component", "platform", "trellis_source", "auth")
      or label_replace(trellis:process_snapshot_fresh{trellis_source=~"jobs|events|health"} == 1, "trellis_component", "$1", "trellis_source", "(.*)")
      or label_replace(trellis:process_snapshot_fresh{trellis_source="events_dlq"} == 1, "trellis_component", "events", "trellis_source", "events_dlq"))
      and on (job, instance, trellis_cluster, trellis_component) ((trellis_runtime_component_ready{telemetry_pipeline="native"} == 1)
      and on (job, instance, trellis_cluster, trellis_component) (trellis_runtime_component_observed_time{telemetry_pipeline="native"} > 0)
      and on (job, instance, trellis_cluster, trellis_component) ((time() - trellis_runtime_component_observed_time{telemetry_pipeline="native"}) < 45))
  - record: trellis:auth_refresh:p95
    expr: histogram_quantile(0.95, sum by (trellis_cluster, le) (rate(trellis_auth_flow_duration_bucket{telemetry_pipeline="native",trellis_operation="context_refresh",trellis_phase="total"}[5m])))
  - record: trellis:projection_snapshot_fresh
    expr: label_replace(trellis:snapshot_fresh{trellis_source=~"jobs|events|health"}, "trellis_component", "$1", "trellis_source", "(.*)")
      or label_replace(trellis:snapshot_fresh{trellis_source="events"}, "trellis_component", "events_dlq", "trellis_source", "events")
  - record: trellis:projection_owner_fresh
    expr: trellis:source_owner_fresh{trellis_source=~"jobs|events|health"}
      or label_replace(trellis:source_owner_fresh{trellis_source="events"}, "trellis_component", "events_dlq", "trellis_source", "events")
  - record: trellis:auth_post_commit_pending
    expr: max by (trellis_cluster) (trellis_auth_post_commit_pending{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="auth"})
  - record: trellis:auth_post_commit_oldest_age
    expr: max by (trellis_cluster) (trellis_auth_post_commit_oldest_age{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="auth"})
  - record: trellis:jobs_ready
    expr: max by (trellis_cluster) (trellis_jobs_ready{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="jobs"})
  - record: trellis:jobs_worker_registrations
    expr: max by (trellis_cluster) (trellis_jobs_worker_registrations{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="jobs"})
  - record: trellis:jobs_waiting_retry
    expr: max by (trellis_cluster) (trellis_jobs_waiting_retry{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="jobs"})
  - record: trellis:jobs_oldest_ready_age
    expr: max by (trellis_cluster) (trellis_jobs_oldest_ready_age{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="jobs"})
  - record: trellis:jobs_dead
    expr: max by (trellis_cluster) (trellis_jobs_dead{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="jobs"})
  - record: trellis:consumer_pending
    expr: max by (trellis_cluster) (trellis_consumer_pending{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="events"})
  - record: trellis:consumer_ack_pending
    expr: max by (trellis_cluster) (trellis_consumer_ack_pending{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="events"})
  - record: trellis:consumer_progress_age
    expr: max by (trellis_cluster) (trellis_consumer_progress_age{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="events"})
  - record: trellis:consumer_missing
    expr: max by (trellis_cluster) (trellis_consumer_missing{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="events"})
  - record: trellis:dlq_entries
    expr: sum by (trellis_cluster) (max by (trellis_cluster, trellis_state) (trellis_dlq_entries{telemetry_pipeline="native"} and on (job, instance, trellis_cluster) trellis:source_owner_fresh{trellis_source="events_dlq"}))
  - record: trellis:projection_pending
    expr: max by (trellis_cluster, trellis_component) (trellis_projection_pending{telemetry_pipeline="native"} and on (job, instance, trellis_cluster, trellis_component) trellis:projection_owner_fresh)
  - record: trellis:projection_progress_age
    expr: max by (trellis_cluster, trellis_component) (trellis_projection_progress_age{telemetry_pipeline="native"} and on (job, instance, trellis_cluster, trellis_component) trellis:projection_owner_fresh)
