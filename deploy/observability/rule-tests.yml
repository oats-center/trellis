        exp_samples:
          - labels: 'trellis:jobs_worker_registrations{trellis_cluster="example"}'
            value: 0
    alert_rule_test:
      - eval_time: 2m
        alertname: TrellisJobsNoWorkers
        exp_alerts: []
      - eval_time: 15m
        alertname: TrellisJobsNoWorkers
        exp_alerts:
          - exp_labels: {trellis_cluster: example, severity: critical}
