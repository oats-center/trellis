      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="b",trellis_source="health"}'
        values: '0x80'
    promql_expr_test:
      - expr: trellis:process_snapshot_fresh{trellis_source="jobs"}
        eval_time: 15m
        exp_samples:
          - labels: 'trellis:process_snapshot_fresh{trellis_cluster="example",job="native",instance="a",trellis_source="jobs"}'
            value: 0
          - labels: 'trellis:process_snapshot_fresh{trellis_cluster="example",job="native",instance="b",trellis_source="jobs"}'
            value: 1
      - expr: trellis:jobs_ready
        eval_time: 15m
        exp_samples:
          - labels: 'trellis:jobs_ready{trellis_cluster="example"}'
            value: 0
      - expr: trellis:projection_pending
        eval_time: 15m
        exp_samples:
          - labels: 'trellis:projection_pending{trellis_cluster="example",trellis_component="jobs"}'
            value: 0
      - expr: trellis:source_owner_fresh{trellis_source="health"}
        eval_time: 15m
        exp_samples: []
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisJobsBacklogOld
        exp_alerts: []
      - eval_time: 15m
        alertname: TrellisProjectionStalled
        exp_alerts: []
