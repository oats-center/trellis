      - series: 'trellis_jobs_oldest_ready_age{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="b"}'
        values: '0x80'
      - series: 'trellis_projection_pending{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="a",trellis_component="jobs"}'
        values: '10x80'
      - series: 'trellis_projection_pending{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="b",trellis_component="jobs"}'
        values: '0x80'
      - series: 'trellis_projection_progress_age{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="a",trellis_component="jobs"}'
        values: '600x80'
      - series: 'trellis_projection_progress_age{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="b",trellis_component="jobs"}'
        values: '0x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",job="native",instance="a",trellis_source="health"}'
