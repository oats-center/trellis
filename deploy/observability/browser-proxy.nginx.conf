# Include the map and limit_req_zone in http{}, locations in the existing HTTPS
# Console/Portal virtual host. Do not expose the native 4318 listener.
# This is a same-origin telemetry relay only, never an arbitrary proxy URL.
map $http_origin $trellis_browser_origin_ok {
    default 0;
    "https://trellis.example.invalid" 1; # operator: exact Console/Portal origin
}
limit_req_zone $binary_remote_addr zone=trellis_browser_otel:10m rate=10r/s;

