[package]
name = "trellis-runtime-acceptance"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22.1"
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
runtime-trellis = { path = "crates/runtime-trellis" }
runtime-live-v2 = { path = "v2/crates/runtime-live-v2" }
runtime-pinned-trellis = { path = "../runtime-pinned/crates/runtime-pinned-trellis" }
trellis-runtime-apis = { path = "../../../crates/runtime-apis" }
trellis-rs = { version = "0.100.0-rc.16", features = ["telemetry-otlp"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
time = { version = "0.3", features = ["formatting"] }
ulid = "1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
